<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg2: #0a1220;
    --panel: rgba(10, 18, 32, 0.7);
    --border: rgba(100, 220, 255, 0.15);
    --border-bright: rgba(100, 220, 255, 0.45);
    --cyan: #5ee2ff;
    --cyan-dim: #2a8aa8;
    --amber: #ffb347;
    --steel: #a8b8cc;
    --magenta: #ff4fa3;
    --gold: #ffe88a;
    --text: #c8d4e0;
    --text-dim: #6a7a8c;
    --danger: #ff5577;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: radial-gradient(ellipse at 20% 0%, #0d1830 0%, var(--bg) 50%),
                radial-gradient(ellipse at 80% 100%, #1a0a2e 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .app { padding: 24px; position: relative; z-index: 3; }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(
      0deg, transparent 0px, transparent 2px,
      rgba(94, 226, 255, 0.025) 2px, rgba(94, 226, 255, 0.025) 3px
    );
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* HEADER */
  .hdr {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 16px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Syncopate', 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 24px;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(94, 226, 255, 0.4);
    letter-spacing: 0.18em;
  }
  .sub { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .sub .sector-id { color: var(--cyan-dim); }
  .sub .sector-trait { color: var(--amber); margin-left: 8px; }
  .hdr-right { display: flex; gap: 12px; align-items: center; }
  .knowledge {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 16px;
    background: linear-gradient(135deg, rgba(255, 79, 163, 0.1), rgba(255, 79, 163, 0.02));
    border: 1px solid rgba(255, 79, 163, 0.3);
  }
  .knowledge span { color: var(--magenta); font-size: 10px; letter-spacing: 0.15em; }
  .knowledge strong { color: #fff; font-size: 18px; font-weight: 500; }
  .knowledge em { color: var(--text-dim); font-style: normal; font-size: 11px; }
  .save-status {
    color: var(--text-dim); font-size: 10px; letter-spacing: 0.15em;
    display: flex; align-items: center; gap: 6px;
  }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan-dim); }
  .save-dot.active { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* RESOURCES */
  .res-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .res {
    background: var(--panel); border: 1px solid var(--border);
    border-left: 2px solid var(--c); padding: 12px 16px;
    backdrop-filter: blur(4px); transition: border-color 0.2s;
  }
  .res:hover { border-color: var(--c); }
  .res-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--c); font-size: 10px; letter-spacing: 0.2em; margin-bottom: 4px;
  }
  .res-sym { font-size: 14px; }
  .res-val {
    font-size: 22px; font-weight: 500; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .res-rate { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* MAIN */
  .main { display: grid; grid-template-columns: 180px 320px 1fr; gap: 20px; align-items: stretch; }
  @media (max-width: 1100px) { .main { grid-template-columns: 160px 280px 1fr; } }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(4px); padding: 16px;
  }
  .panel-title {
    color: var(--cyan-dim); font-size: 10px;
    letter-spacing: 0.2em; margin-bottom: 12px;
  }

  /* COCKPIT COLUMNS */
  .log-col { display: flex; flex-direction: column; }
  .log-col .panel { flex: 1; overflow: hidden; }
  .center-col { display: flex; flex-direction: column; align-items: stretch; min-width: 0; }
  .right-col { display: flex; flex-direction: column; min-width: 0; }
  .reactor-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
  .reactor {
    width: 300px; height: 300px; position: relative;
    background: radial-gradient(circle, rgba(94, 226, 255, 0.15) 0%, transparent 70%);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 8px 0;
  }
  .reactor-ring {
    position: absolute; inset: 0; border: 1px solid var(--cyan-dim);
    border-radius: 50%; animation: spin 12s linear infinite;
  }
  .reactor-ring.r2 {
    inset: 14px; border-color: rgba(94, 226, 255, 0.4);
    border-top-color: var(--cyan); border-right-color: transparent;
    animation: spin 6s linear infinite reverse;
  }
  .reactor-core {
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, #1a3a4d 0%, #050810 80%);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 30px rgba(94, 226, 255, 0.4),
                inset 0 0 30px rgba(94, 226, 255, 0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .reactor:hover .reactor-core {
    box-shadow: 0 0 50px rgba(94, 226, 255, 0.7),
                inset 0 0 40px rgba(94, 226, 255, 0.3);
  }
  .reactor.pulse .reactor-core {
    transform: scale(0.92);
    box-shadow: 0 0 80px rgba(94, 226, 255, 1),
                inset 0 0 50px rgba(94, 226, 255, 0.5);
  }
  .reactor-sym {
    font-size: 56px; color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
  }
  .reactor-amt {
    font-size: 14px; color: var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  .reactor-hint {
    color: var(--text-dim); font-size: 10px;
    letter-spacing: 0.2em; margin-top: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* LOG */
  .log { display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
  .log-line {
    color: var(--cyan-dim); font-size: 11px;
    animation: fadein 0.4s;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateX(-4px); }
    to { opacity: 1; transform: none; }
  }

  /* TABS */
  .right-col { display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab {
    background: transparent; border: 1px solid var(--border); border-bottom: none;
    color: var(--text-dim); padding: 10px 18px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.15em;
    cursor: pointer; position: relative; transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--panel); color: var(--cyan);
    border-color: var(--border-bright);
    border-bottom: 1px solid var(--panel); margin-bottom: -1px;
  }
  .tab.jump-tab { color: var(--magenta); border-color: rgba(255, 79, 163, 0.3); }
  .tab.jump-tab.active { color: var(--magenta); border-color: rgba(255, 79, 163, 0.6); }
  .badge {
    display: inline-block; background: var(--amber); color: #000;
    padding: 1px 6px; font-size: 9px; margin-left: 8px; font-weight: 700;
  }
  .tab-panel { min-height: 400px; border-top: none; }

  /* CARDS */
  .grid-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .card {
    background: rgba(5, 8, 16, 0.5); border: 1px solid var(--border);
    border-left: 2px solid var(--c); padding: 12px;
    text-align: left; cursor: pointer; color: var(--text);
    font-family: inherit; transition: all 0.15s;
  }
  .card:disabled { cursor: not-allowed; opacity: 0.55; }
  .card.afford:hover {
    background: rgba(94, 226, 255, 0.05); border-color: var(--c);
    transform: translateX(2px);
  }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-name { color: var(--c); font-size: 13px; font-weight: 500; }
  .card-owned { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .card-desc { font-size: 11px; color: var(--text-dim); margin: 6px 0; }
  .card-foot {
    font-size: 10px; margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .card-cost { color: var(--text); }
  .card-rate { color: var(--cyan-dim); }
  .empty { color: var(--text-dim); font-size: 12px; padding: 24px; text-align: center; }

  /* RESEARCH */
  .branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .branches { grid-template-columns: 1fr; } }
  .branch { display: flex; flex-direction: column; gap: 8px; }
  .branch-title {
    color: var(--amber); font-size: 10px; letter-spacing: 0.2em;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .branch-nodes { display: flex; flex-direction: column; gap: 8px; }
  .node {
    background: rgba(5, 8, 16, 0.5); border: 1px solid var(--border);
    padding: 10px; text-align: left; cursor: pointer; color: var(--text);
    font-family: inherit; transition: all 0.15s; position: relative;
  }
  .node:disabled { cursor: not-allowed; }
  .node.locked { opacity: 0.3; cursor: not-allowed; }
  .node.afford { border-color: var(--amber); box-shadow: 0 0 12px rgba(255, 179, 71, 0.2); }
  .node.afford:hover { background: rgba(255, 179, 71, 0.05); }
  .node.owned { border-color: var(--cyan); background: rgba(94, 226, 255, 0.04); cursor: default; }
  .node-tier {
    position: absolute; top: 8px; right: 10px;
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.15em;
  }
  .node-name { font-size: 12px; color: var(--cyan); margin-bottom: 4px; }
  .node-effect { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
  .node-cost {
    font-size: 10px; color: var(--amber);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .node-status { font-size: 10px; color: var(--cyan); letter-spacing: 0.15em; }

  /* JUMP */
  .jump-pane { padding: 12px; }
  .jump-title { color: var(--magenta); font-size: 14px; letter-spacing: 0.2em; margin-bottom: 16px; }
  .jump-text { font-size: 12px; line-height: 1.7; color: var(--text); margin-bottom: 20px; }
  .jump-text strong { color: var(--magenta); }
  .jump-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 20px; padding: 16px;
    background: rgba(255, 79, 163, 0.04);
    border: 1px solid rgba(255, 79, 163, 0.2);
  }
  .jump-stats > div { display: flex; flex-direction: column; gap: 4px; }
  .jump-stats span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.15em; }
  .jump-stats strong { color: #fff; font-size: 20px; font-weight: 500; }
  .jump-stats .gain { color: var(--magenta); }
  .jump-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--magenta), #c8307f);
    border: none; color: #fff; padding: 14px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.2em;
    cursor: pointer; transition: all 0.2s;
  }
  .jump-btn:disabled {
    background: rgba(255, 79, 163, 0.1); color: var(--text-dim); cursor: not-allowed;
  }
  .jump-btn:not(:disabled):hover {
    box-shadow: 0 0 30px rgba(255, 79, 163, 0.5); transform: translateY(-1px);
  }
  .jump-hint { color: var(--text-dim); font-size: 10px; margin-top: 8px; text-align: center; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--bg2); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 12px 24px; font-size: 12px; letter-spacing: 0.15em;
    z-index: 100; box-shadow: 0 0 30px rgba(94, 226, 255, 0.4);
    animation: toast-in 0.3s;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    animation: fadein 0.3s;
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--cyan);
    box-shadow: 0 0 60px rgba(94, 226, 255, 0.4);
    padding: 32px; max-width: 480px; width: calc(100% - 32px);
  }
  .modal-title {
    font-family: 'Syncopate', 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--cyan); font-size: 16px;
    letter-spacing: 0.18em; margin-bottom: 16px;
  }
  .modal-body {
    font-size: 12px; line-height: 1.7; color: var(--text);
    margin-bottom: 20px;
  }
  .modal-gains { background: rgba(94, 226, 255, 0.05); padding: 12px; margin: 12px 0; }
  .modal-gains-line {
    display: flex; justify-content: space-between; padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .modal-btn {
    width: 100%; background: var(--cyan); color: var(--bg);
    border: none; padding: 12px; font-family: inherit; font-size: 12px;
    letter-spacing: 0.2em; cursor: pointer; font-weight: 500;
  }
  .modal-btn:hover { background: #fff; }

  /* RESET */
  .reset-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 6px 12px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.15em;
    cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* PROTOCOLS — SUB-TABS */
  .sub-tabs {
    display: flex; gap: 0; align-items: center;
    border-bottom: 1px solid var(--border);
    margin: -16px -16px 16px;
    padding: 0 16px;
  }
  .sub-tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dim); padding: 12px 16px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.18em;
    cursor: pointer; transition: all 0.15s;
  }
  .sub-tab:hover { color: var(--text); }
  .sub-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .sub-tab-meter {
    margin-left: auto; display: flex; align-items: baseline; gap: 8px;
    padding: 8px 12px;
  }
  .meter-label {
    color: var(--text-dim); font-size: 9px; letter-spacing: 0.2em;
  }
  .meter-val {
    color: var(--cyan); font-size: 18px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 8px rgba(94, 226, 255, 0.4);
  }
  .pp-badge { background: var(--cyan); color: var(--bg); }

  /* TREE */
  .tree-wrap {
    display: grid; grid-template-columns: 1fr 280px; gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) { .tree-wrap { grid-template-columns: 1fr; } }
  .tree-svg-wrap {
    background: radial-gradient(circle, rgba(94,226,255,0.04) 0%, transparent 70%);
    border: 1px solid var(--border);
    padding: 16px;
  }
  .tree-info { display: flex; flex-direction: column; gap: 16px; }
  .tree-info-title { color: var(--cyan-dim); font-size: 10px; letter-spacing: 0.2em; }
  .tree-info-text { font-size: 11px; line-height: 1.6; color: var(--text-dim); margin: 0; }
  .ring-legend { display: flex; flex-direction: column; gap: 4px; }
  .ring-row {
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(5,8,16,0.5); border-left: 2px solid var(--cyan-dim);
    font-size: 11px;
  }
  .ring-row.locked { opacity: 0.35; border-left-color: var(--text-dim); }
  .ring-name { color: var(--text); letter-spacing: 0.1em; }
  .ring-progress { color: var(--cyan-dim); font-variant-numeric: tabular-nums; }
  .tree-node-detail {
    background: rgba(5,8,16,0.5);
    border: 1px solid var(--border);
    padding: 12px;
    min-height: 60px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text);
  }
  .tree-node-detail em { color: var(--text-dim); font-style: italic; }
  .tree-node-detail .detail-name { color: var(--cyan); font-size: 12px; margin-bottom: 4px; }
  .tree-node-detail .detail-cost { color: var(--amber); font-size: 10px; margin-top: 6px; }

  /* TREE NODES — SVG */
  .tree-node circle {
    fill: rgba(5,8,16,0.9); stroke: var(--text-dim); stroke-width: 1.5;
    transition: all 0.2s;
  }
  .tree-node text { fill: var(--text-dim); font-family: 'JetBrains Mono', monospace; pointer-events: none; }
  .tree-node.locked circle { fill: rgba(5,8,16,0.5); stroke: rgba(106,122,140,0.3); }
  .tree-node.locked text { fill: rgba(106,122,140,0.4); }
  .tree-node.available circle { fill: rgba(5,8,16,0.9); stroke: var(--cyan-dim); }
  .tree-node.available text { fill: var(--cyan-dim); }
  .tree-node.afford circle {
    fill: rgba(94,226,255,0.1); stroke: var(--cyan); stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(94,226,255,0.5));
  }
  .tree-node.afford text { fill: var(--cyan); }
  .tree-node.afford, .afford-pulse { animation: tree-pulse 2s ease-in-out infinite; }

  /* VOID RESET */
  .void-reset-section {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid rgba(255,79,163,0.25);
  }
  .void-reset-title { color: var(--magenta); font-size: 12px; letter-spacing: 0.2em; margin-bottom: 12px; }
  .void-btn {
    width: 100%;
    background: linear-gradient(135deg, #8a1050, #3a0020);
    border: 1px solid var(--magenta); color: var(--magenta); padding: 12px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.18em;
    cursor: pointer; transition: all 0.2s; margin-top: 10px;
  }
  .void-btn:hover { background: linear-gradient(135deg, var(--magenta), #8a1050); color: #fff; box-shadow: 0 0 24px rgba(255,79,163,0.4); }
  .vs-display {
    background: rgba(255,79,163,0.08); border: 1px solid rgba(255,79,163,0.3);
    padding: 12px 16px; margin-bottom: 12px;
  }
  .vs-display .vs-label { color: var(--text-dim); font-size: 10px; letter-spacing: 0.2em; }
  .vs-display .vs-val { font-size: 28px; font-weight: 500; color: var(--magenta); text-shadow: 0 0 12px rgba(255,79,163,0.5); font-variant-numeric: tabular-nums; }
  .vs-display .vs-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* WAVE 8 — ANOMALIES */
  .anomaly-bg { backdrop-filter: blur(8px); }
  .anomaly-modal {
    border-color: var(--magenta) !important;
    box-shadow: 0 0 80px rgba(255,79,163,0.35) !important;
    max-width: 540px;
  }
  .anomaly-cat {
    color: var(--magenta); font-size: 10px; letter-spacing: 0.3em;
    margin-bottom: 6px;
  }
  .anomaly-desc {
    font-style: italic; line-height: 1.7; color: var(--text);
    padding: 12px 14px; background: rgba(255,79,163,0.04);
    border-left: 2px solid var(--magenta); margin: 0 0 18px;
  }
  .anomaly-choices { display: flex; flex-direction: column; gap: 8px; }
  .anomaly-choice {
    background: rgba(94,226,255,0.04); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px;
    font-family: inherit; cursor: pointer; text-align: left;
    transition: all 0.15s;
  }
  .anomaly-choice:hover {
    background: rgba(94,226,255,0.10); border-color: var(--cyan);
    transform: translateX(3px);
  }
  .anomaly-choice-label {
    color: var(--cyan); font-size: 12px; letter-spacing: 0.16em;
    margin-bottom: 3px; font-weight: 500;
  }
  .anomaly-choice-desc { color: var(--text-dim); font-size: 11px; line-height: 1.5; }
  .anomaly-outcome {
    padding: 14px; border: 1px dashed var(--cyan-dim);
    background: rgba(5,8,16,0.5);
    font-style: italic; line-height: 1.7;
    color: var(--text);
  }

  /* WAVE 8 — HULL INTEGRITY */
  .hull-bar-wrap { margin-top: 4px; }
  .hull-bar {
    position: relative; height: 6px; background: rgba(5,8,16,0.7);
    border: 1px solid var(--border); overflow: hidden;
  }
  .hull-fill {
    height: 100%; transition: width 0.5s, background 0.4s, box-shadow 0.4s;
  }
  .hull-fill.high { background: var(--cyan);   box-shadow: 0 0 8px rgba(94,226,255,0.5); }
  .hull-fill.mid  { background: var(--amber);  box-shadow: 0 0 8px rgba(255,179,71,0.5); }
  .hull-fill.low  { background: var(--danger); box-shadow: 0 0 10px rgba(255,85,119,0.6); }
  .hull-pct {
    font-size: 14px; font-variant-numeric: tabular-nums;
  }

  /* WAVE 8 — SECTOR MAP */
  .sector-map {
    display: flex; gap: 4px; align-items: center;
    padding: 14px 16px;
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    overflow-x: auto;
  }
  .sm-dot {
    width: 18px; height: 18px; border-radius: 50%;
    flex-shrink: 0; position: relative; cursor: help;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .sm-dot.current {
    animation: tree-pulse 2.4s ease-in-out infinite;
    box-shadow: 0 0 14px currentColor;
    border-color: rgba(255,255,255,0.5);
  }
  .sm-conn {
    width: 14px; height: 1px; background: rgba(94,226,255,0.2);
    flex-shrink: 0;
  }
  .sm-label {
    color: var(--text-dim); font-size: 9px; letter-spacing: 0.2em;
    margin-right: 8px; white-space: nowrap;
  }

  /* WAVE 8 — CODEX */
  .codex-summary {
    padding: 16px;
    background: rgba(94,226,255,0.04); border: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 16px;
  }
  .codex-summary > div { display: flex; flex-direction: column; gap: 4px; }
  .codex-summary span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.2em; }
  .codex-summary strong { color: #fff; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .codex-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .codex-entry {
    padding: 10px 14px; background: rgba(5,8,16,0.5);
    border: 1px solid var(--border); border-left: 2px solid var(--cyan-dim);
    transition: border-color 0.15s;
  }
  .codex-entry:hover { border-left-color: var(--cyan); }
  .codex-entry.locked {
    opacity: 0.42; border-left-color: var(--text-dim);
  }
  .codex-entry-cat { font-size: 9px; color: var(--text-dim); letter-spacing: 0.22em; }
  .codex-entry-name { font-size: 12px; color: var(--text); margin-top: 3px; }
  .codex-entry-outcome { font-size: 10px; color: var(--text-dim); margin-top: 5px; font-style: italic; line-height: 1.5; }
  .codex-entry-meta { font-size: 9px; color: var(--cyan-dim); margin-top: 4px; letter-spacing: 0.1em; }

  /* WAVE 10 — CREW LEVELING */
  .crew-level-pill {
    display: inline-block; padding: 1px 7px; font-size: 9px; font-weight: 700;
    background: var(--cr-c, var(--text-dim)); color: #000;
    letter-spacing: 0.15em; margin-right: 6px;
  }
  .crew-xp-bar {
    height: 3px; background: rgba(5,8,16,0.6);
    border-top: 1px solid rgba(94,226,255,0.1); margin-top: 6px;
    position: relative; overflow: hidden;
  }
  .crew-xp-fill {
    height: 100%; background: var(--cr-c, var(--cyan-dim));
    box-shadow: 0 0 4px var(--cr-c, var(--cyan-dim));
    transition: width 0.4s;
  }
  .crew-xp-label { font-size: 9px; color: var(--text-dim); margin-top: 2px; letter-spacing: 0.1em; }
  .crew-title { font-size: 9px; color: var(--gold); letter-spacing: 0.18em; margin-top: 2px; }
  /* Memory event modal */
  .memory-modal {
    border-color: var(--cyan-dim) !important;
    box-shadow: 0 0 60px rgba(94,226,255,0.25) !important;
    max-width: 480px;
  }
  .memory-text {
    font-style: italic; line-height: 1.8; color: var(--text);
    padding: 14px; border: 1px dashed var(--cyan-dim);
    background: rgba(5,8,16,0.6);
  }

  /* WAVE 12 — AUTO-BUY + SETTINGS + STATS */
  .auto-toggle {
    position: absolute; top: 6px; right: 8px;
    width: 22px; height: 22px;
    border: 1px solid var(--border); background: rgba(5,8,16,0.7);
    color: var(--text-dim); font-size: 9px; letter-spacing: 0.1em;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-weight: 700;
  }
  .auto-toggle:hover { border-color: var(--cyan); color: var(--text); }
  .auto-toggle.active {
    background: var(--cyan); color: #000; border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(94,226,255,0.5);
  }
  .card { position: relative; }
  .hull-warning {
    background: rgba(255,85,119,0.15); border: 1px solid var(--danger);
    color: var(--danger); padding: 8px 14px;
    font-size: 11px; letter-spacing: 0.15em;
    animation: tree-pulse 1.5s ease-in-out infinite;
    display: flex; align-items: center; gap: 8px;
  }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: rgba(5,8,16,0.5);
    border: 1px solid var(--border); margin-bottom: 6px;
  }
  .setting-label { color: var(--text); font-size: 11px; letter-spacing: 0.1em; }
  .setting-desc { color: var(--text-dim); font-size: 10px; margin-top: 3px; }
  .setting-toggle {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 5px 14px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.18em;
    cursor: pointer; transition: all 0.15s;
  }
  .setting-toggle.on {
    background: var(--cyan); color: var(--bg); border-color: var(--cyan);
  }
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .stat-card {
    background: rgba(5,8,16,0.55); border: 1px solid var(--border);
    padding: 10px 14px;
  }
  .stat-card-label {
    color: var(--text-dim); font-size: 9px; letter-spacing: 0.22em;
  }
  .stat-card-val {
    color: #fff; font-size: 18px; font-weight: 500;
    font-variant-numeric: tabular-nums; margin-top: 3px;
  }
  .stat-card-sub { color: var(--cyan-dim); font-size: 10px; margin-top: 3px; }

  /* WAVE 13 — COLOR THEMES (overrides --cyan and accent colors) */
  body[data-theme="amber"] {
    --cyan: #ffb347; --cyan-dim: #b8853c;
  }
  body[data-theme="magenta"] {
    --cyan: #ff7ec0; --cyan-dim: #c84a8a;
  }
  body[data-theme="gold"] {
    --cyan: #ffe88a; --cyan-dim: #c8b46a;
  }
  body[data-theme="steel"] {
    --cyan: #a8b8cc; --cyan-dim: #6a7a8c;
  }

  /* WAVE 13 — HEADER HULL ALERT */
  .hull-alert {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 14px;
    background: linear-gradient(135deg, rgba(255,85,119,0.12), rgba(255,85,119,0.02));
    border: 1px solid rgba(255,85,119,0.4);
    animation: tree-pulse 1.5s ease-in-out infinite;
  }
  .hull-alert span { color: var(--danger); font-size: 10px; letter-spacing: 0.18em; }
  .hull-alert strong { color: #fff; font-size: 16px; }
  .theme-swatch {
    width: 28px; height: 28px; border: 1px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  .theme-swatch:hover { transform: scale(1.1); border-color: #fff; }
  .theme-swatch.active { border-color: #fff; box-shadow: 0 0 12px currentColor; }

  /* WAVE 19 — ASCII SHIP RENDERING */
  .ship-ascii {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.05;
    letter-spacing: 0;
    color: var(--ship-c);
    margin: 0;
    text-align: center;
    white-space: pre;
    text-shadow: 0 0 6px rgba(94,226,255,0.15);
  }
  .ship-ascii .s-fr  { color: var(--ship-c); opacity: 0.85; }
  .ship-ascii .s-hi  { color: var(--ship-c); opacity: 1; text-shadow: 0 0 4px var(--ship-c); }
  .ship-ascii .s-md  { color: var(--ship-c); opacity: 0.65; }
  .ship-ascii .s-lo  { color: var(--ship-c); opacity: 0.38; }
  .ship-ascii .s-cg  { color: var(--ship-ck); opacity: 0.9; }
  .ship-ascii .s-ec  { color: var(--ship-eng); opacity: 0.95; text-shadow: 0 0 5px var(--ship-eng); }
  .ship-ascii .s-eng {
    color: var(--ship-eng);
    animation: engine-flare 1.3s ease-in-out infinite;
    text-shadow: 0 0 6px var(--ship-eng);
  }
  @keyframes engine-flare {
    0%, 100% { opacity: 1; text-shadow: 0 0 4px var(--ship-eng); }
    50%      { opacity: 0.55; text-shadow: 0 0 10px var(--ship-eng); }
  }
  /* Smaller scale variant for the Ship Yard preview cards */
  .ship-ascii.ship-ascii-mini {
    font-size: 7px;
    line-height: 1.05;
  }

  /* WAVE 15 — RESONANCE UI */
  .resonance-wrap { display: flex; flex-direction: column; gap: 16px; }
  .res-progress-bar {
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    padding: 12px 14px;
  }
  .res-progress-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .res-progress-head span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.2em; }
  .res-progress-head strong { color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; }
  .res-cats { display: flex; flex-direction: column; gap: 10px; }
  .res-cat {
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    border-left: 3px solid var(--res-c, var(--cyan-dim));
    padding: 12px 14px;
    transition: border-color 0.15s;
  }
  .res-cat:hover { border-color: var(--res-c, var(--cyan)); }
  .res-cat-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .res-cat-name { font-size: 12px; letter-spacing: 0.22em; font-weight: 700; }
  .res-cat-master {
    margin-left: 10px; color: var(--gold); font-size: 9px;
    letter-spacing: 0.18em;
  }
  .res-cat-pts {
    color: #fff; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .res-bar {
    position: relative; height: 5px; background: rgba(5,8,16,0.6);
    border: 1px solid var(--border); overflow: hidden;
  }
  .res-fill { height: 100%; transition: width 0.4s, background 0.4s; }
  .res-cat-effect {
    color: var(--text-dim); font-size: 11px; margin-top: 6px;
  }
  .res-cat-mastery {
    color: var(--gold); font-size: 10px; margin-top: 4px;
    letter-spacing: 0.1em; font-style: italic;
  }
  .res-cat-actions {
    display: flex; gap: 6px; margin-top: 8px;
    flex-wrap: wrap;
  }
  .res-buy {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 5px 12px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.12em;
    cursor: pointer; transition: all 0.14s;
  }
  .res-buy:disabled { opacity: 0.4; cursor: not-allowed; }
  .res-buy.afford {
    border-color: var(--res-c, var(--cyan)); color: var(--res-c, var(--cyan));
  }
  .res-buy.afford:hover {
    background: rgba(94,226,255,0.08);
    box-shadow: 0 0 8px var(--res-c, var(--cyan));
  }
  .tree-node.owned circle {
    fill: var(--cyan); stroke: #fff;
    filter: drop-shadow(0 0 8px var(--cyan));
  }
  .tree-node.owned text { fill: var(--bg); font-weight: 700; }
  .tree-node:hover circle:not([disabled]) { stroke-width: 2.5; }
  @keyframes tree-pulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(94,226,255,0.5)); }
    50% { filter: drop-shadow(0 0 12px rgba(94,226,255,0.9)); }
  }

  /* OBJECTIVES */
  .obj-wrap { display: flex; flex-direction: column; gap: 16px; }
  .obj-summary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px;
    background: rgba(94,226,255,0.04);
    border: 1px solid var(--border);
  }
  .obj-summary > div { display: flex; flex-direction: column; gap: 4px; }
  .obj-summary span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.18em; }
  .obj-summary strong {
    color: #fff; font-size: 22px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .obj-cat { display: flex; flex-direction: column; gap: 6px; }
  .obj-cat-title {
    color: var(--amber); font-size: 10px; letter-spacing: 0.2em;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .obj-list { display: flex; flex-direction: column; gap: 4px; }
  .obj {
    display: grid; grid-template-columns: 24px 1fr auto; gap: 12px;
    padding: 8px 12px;
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    border-left: 2px solid var(--text-dim);
    align-items: center;
    font-size: 11px;
  }
  .obj.done {
    border-left-color: var(--cyan);
    background: rgba(94,226,255,0.03);
  }
  .obj-marker { color: var(--text-dim); font-size: 14px; }
  .obj.done .obj-marker { color: var(--cyan); }
  .obj-name { color: var(--text); }
  .obj.done .obj-name { color: var(--cyan); }
  .obj-desc { color: var(--text-dim); font-size: 10px; margin-top: 2px; }
  .obj-pp {
    color: var(--amber); font-size: 10px;
    letter-spacing: 0.15em; font-variant-numeric: tabular-nums;
  }
  .obj.done .obj-pp { color: var(--cyan-dim); }

  /* STARFIELD CANVAS */
  #starfield-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* REACTOR PANEL — cockpit hero, stars show through */
  .reactor-panel {
    background: rgba(5, 8, 16, 0.28) !important;
    backdrop-filter: blur(2px);
    padding: 32px 24px;
    gap: 16px;
  }
  .reactor-ring.r2 { inset: 18px; }

  /* BUY QUANTITY BAR */
  .buy-qty-bar {
    display: flex; gap: 4px; align-items: center; margin-bottom: 14px;
  }
  .buy-qty-bar > span {
    color: var(--text-dim); font-size: 10px; letter-spacing: 0.18em; margin-right: 6px;
  }
  .qty-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 5px 13px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.13em;
    cursor: pointer; transition: all 0.12s;
  }
  .qty-btn:hover { border-color: var(--cyan-dim); color: var(--text); }
  .qty-btn.active {
    border-color: var(--cyan); color: var(--cyan);
    background: rgba(94, 226, 255, 0.07);
  }

  /* ENGRAMS */
  .engram-list { display: flex; flex-direction: column; gap: 6px; }
  .engram {
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px;
    padding: 10px 14px;
    background: rgba(5, 8, 16, 0.55);
    border: 1px solid var(--border);
    border-left: 3px solid var(--eg-c, var(--text-dim));
    align-items: center;
  }
  .engram.decrypted { opacity: 0.65; }
  .engram-rarity { font-size: 9px; letter-spacing: 0.22em; color: var(--eg-c, var(--text-dim)); }
  .engram-name { font-size: 12px; color: var(--text); margin-top: 2px; }
  .engram-flavor {
    font-size: 10px; color: var(--text-dim); margin-top: 5px;
    line-height: 1.55; font-style: italic;
  }
  .engram-claimed { font-size: 10px; color: var(--cyan-dim); margin-top: 4px; }
  .engram-meta { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .decrypt-btn {
    background: transparent; border: 1px solid var(--eg-c, var(--text-dim));
    color: var(--eg-c, var(--text-dim));
    padding: 6px 10px; font-family: inherit; font-size: 10px;
    letter-spacing: 0.13em; cursor: pointer; transition: all 0.14s;
    white-space: nowrap; line-height: 1.5; text-align: center;
  }
  .decrypt-btn:not(:disabled):hover { background: rgba(94, 226, 255, 0.08); }
  .decrypt-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .engram-done-mark { font-size: 14px; color: var(--eg-c, var(--text-dim)); }
  .engram-summary {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
    padding: 16px; background: rgba(94,226,255,0.04);
    border: 1px solid var(--border); margin-bottom: 4px;
  }
  .engram-summary > div { display: flex; flex-direction: column; gap: 4px; }
  .engram-summary span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.18em; }
  .engram-summary strong { color: #fff; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* BRIDGE */
  .bridge-view { display: flex; flex-direction: column; gap: 20px; padding: 4px; }
  .ship-panel {
    display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start;
    background: rgba(5,8,16,0.5); border: 1px solid var(--border); padding: 16px;
  }
  .ship-art {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px; border: 1px solid var(--border);
    background: rgba(5,8,16,0.6);
  }
  .ship-name { color: var(--cyan); font-size: 10px; letter-spacing: 0.2em; }
  .ship-subname { color: var(--text-dim); font-size: 9px; letter-spacing: 0.1em; }
  .ship-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ship-stat {
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    padding: 8px 12px;
  }
  .ship-stat-label { color: var(--text-dim); font-size: 9px; letter-spacing: 0.15em; }
  .ship-stat-val { font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* CREW */
  .crew-list { display: flex; flex-direction: column; gap: 6px; }
  .crewmate {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 12px;
    padding: 10px 14px;
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    border-left: 3px solid var(--cr-c, var(--text-dim));
    align-items: center;
    transition: opacity 0.2s;
  }
  .crewmate.dead { opacity: 0.4; filter: grayscale(0.8); }
  .crewmate.injured { border-left-color: var(--amber) !important; }
  .crew-sym { font-size: 18px; color: var(--cr-c, var(--text-dim)); text-align: center; }
  .crew-name { font-size: 12px; color: var(--text); }
  .crew-class { font-size: 10px; letter-spacing: 0.12em; margin-top: 2px; color: var(--cr-c, var(--text-dim)); }
  .crew-desc { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
  .crew-status { font-size: 10px; letter-spacing: 0.1em; text-align: right; white-space: nowrap; }
  .crew-joined { font-size: 9px; color: var(--text-dim); margin-top: 3px; }
  .crew-empty {
    padding: 20px; border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 11px; text-align: center; line-height: 1.8;
  }
</style>
</head>

<canvas id="starfield-canvas"></canvas>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="app" id="app"></div>

<script>
'use strict';

// ============================================================
// VOID PROTOCOL v2 — Wave 4d (Knowledge rebalance + bridge buildings)
// ============================================================

const SAVE_VERSION = 20;
const SAVE_KEY = 'voidProtocol';
const META_KEY = 'voidProtocolMeta';
const MAX_OFFLINE_SECONDS = 4 * 60 * 60; // 4h default (Hoarder extends to 6h)

// --- FORMATTING ---------------------------------------------
const fmt = (n) => {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n.toFixed(n < 10 ? 1 : 0);
  if (n < 1e6) return (n / 1e3).toFixed(2) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  if (n < 1e12) return (n / 1e9).toFixed(2) + 'B';
  if (n < 1e15) return (n / 1e12).toFixed(2) + 'T';
  return n.toExponential(2);
};

// --- RESOURCES ----------------------------------------------
const RESOURCE_LIST = ['energy', 'data', 'alloy', 'plasma', 'aether'];
const RESOURCE_META = {
  energy: { label: 'ENERGY', sym: '◈', color: 'var(--cyan)' },
  data:   { label: 'DATA',   sym: '◇', color: 'var(--amber)' },
  alloy:  { label: 'ALLOY',  sym: '▣', color: 'var(--steel)' },
  plasma: { label: 'PLASMA', sym: '✦', color: 'var(--magenta)' },
  aether: { label: 'AETHER', sym: '✺', color: 'var(--gold)' },
};

// --- MILESTONES ---------------------------------------------
// Each milestone: id, name, desc, pp, check(state, meta) -> boolean
// Order matters for the UI list (groups by category).
const MILESTONES = [
  // First-build milestones

// Geometry — used by spiral renderer. Computed once.
const TREE_GEOMETRY = (() => {
  const ringRadii = { 1: 75, 2: 145, 3: 215, 4: 285, 5: 355, 6: 425 };
  const out = {};
  // Wave 4c: opened Ring 4 for the lone 'r4_aetheric' protocol.
  // Rings 4-6 will be filled in Wave 4e with the full Core Tree expansion.
  for (let ring = 1; ring <= 4; ring++) {
    const nodes = CORE_TREE.filter(n => n.ring === ring);
    const count = nodes.length;
    if (count === 0) continue;
    // start angle offset alternating per ring for variety
    const offset = (ring % 2 === 0) ? Math.PI / count : 0;
    nodes.forEach((n, i) => {
      const angle = (i / count) * Math.PI * 2 + offset - Math.PI / 2;
      out[n.id] = {
        x: Math.cos(angle) * ringRadii[ring],
        y: Math.sin(angle) * ringRadii[ring],
        ring,
        radius: ringRadii[ring],
      };
    });
  }
  return out;
})();

// Check whether a node is unlockable: ring 1 always, ring N requires any ring N-1 node owned
function isNodeUnlockable(node, meta) {
  if (node.ring === 1) return true;
  return CORE_TREE.some(n => n.ring === node.ring - 1 && meta.coreOwned[n.id]);
}

  const node = PATCH_GRID.find(n => n.id === id);

function rollChallenges() {
  // Wave 4c: challenge count scales with total Jumps so Patch Points feel earned.
  // 2 challenges pre-jump, 3 after Jump 1, 4 after Jump 3, 5 after Jump 6.
  // (Reads `meta.totalJumps` — meta is guaranteed loaded by the time freshRun calls this.)
  const jumps = (typeof meta !== 'undefined' && meta) ? (meta.totalJumps || 0) : 0;
  let n = 2;
  if (jumps >= 1) n = 3;
  if (jumps >= 3) n = 4;
  if (jumps >= 6) n = 5;
  const pool = [...CHALLENGE_TEMPLATES];
  const out = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool[idx].id);
    pool.splice(idx, 1);
  }
  return out;
}

function checkChallenges() {
  if (!state.challenges || !state.challengeProgress) return [];
  const newly = [];
  for (const cid of state.challenges) {
    if (state.challengeProgress[cid] && state.challengeProgress[cid].done) continue;
    const tpl = CHALLENGE_TEMPLATES.find(c => c.id === cid);
    if (!tpl) continue;
    if (!state.challengeProgress[cid]) state.challengeProgress[cid] = { progress: 0, done: false, pulses: 0 };
    const current = tpl.track(state, state.challengeProgress[cid]);
    state.challengeProgress[cid].progress = Math.min(current, tpl.target);
    if (current >= tpl.target) {
      state.challengeProgress[cid].done = true;
      state.patchPoints = (state.patchPoints || 0) + tpl.pp;
      newly.push(tpl);
    }
  }
  return newly;
}

let meta = null;

function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return freshMeta();
    const parsed = JSON.parse(raw);
    if (!parsed.metaVersion) parsed.metaVersion = SAVE_VERSION;
    const fresh = freshMeta();
    for (const k of Object.keys(fresh)) {
      if (!(k in parsed)) parsed[k] = fresh[k];
    }
    // Wave 15: one-time migration — refund webOwned + PP into Void Shards
    if ((parsed.metaVersion || 0) < 15) {
      let refund = 0;
      if (parsed.webOwned && typeof WEB_NODES !== 'undefined') {
        for (const nodeId of Object.keys(parsed.webOwned)) {
          const node = WEB_NODES.find(n => n.id === nodeId);
          if (node) refund += node.cost;
        }
      }
      // Refund PP at 1 PP = 1 VS (PP system retired)
      if (parsed.pp && parsed.pp > 0) {
        refund += parsed.pp;
        parsed.pp = 0;
      }
      parsed.voidShards = (parsed.voidShards || 0) + refund;
      parsed.webOwned = {};
      // Ensure resonance object is shaped correctly
      if (!parsed.resonance || typeof parsed.resonance !== 'object') {
        parsed.resonance = { pulse: 0, systems: 0, signal: 0, crew: 0, void: 0 };
      } else {
        for (const k of ['pulse','systems','signal','crew','void']) {
          if (typeof parsed.resonance[k] !== 'number') parsed.resonance[k] = 0;
        }
      }

// --- Wave 4c: ADDITIVE STACKING ---
// Previously meta bonuses and patch bonuses all multiplied together, causing
// parabolic late-game scaling. New model: sum the bonuses and apply once.
// Knowledge × trait stay multiplicative as the "true" prestige/sector axis.
function metaProductionBonus(resource) {
  let bonus = 0;
  if (metaHas('r1_memory')) bonus += 0.05;
  if (resource === 'energy' && metaHas('r2_energy')) bonus += 0.20;
  if (resource === 'data'   && metaHas('r2_data'))   bonus += 0.20;
  if (resource === 'alloy'  && metaHas('r2_alloy'))  bonus += 0.20;
  if (resource === 'plasma' && metaHas('r2_plasma')) bonus += 0.20;
  return bonus;
}

function patchProductionBonus(resource) {
  let bonus = 0;
  if (PATCH_HAS('pa4')) {
    const elapsed = (Date.now() - (state.runStartTime || Date.now())) / 1000;
    if (elapsed < 300) bonus += 0.10;
  }
  if (PATCH_HAS('pb1')) {
    const minutes = (Date.now() - (state.runStartTime || Date.now())) / 60000;
    bonus += Math.min(0.25, minutes * 0.01);
  }
  if (PATCH_HAS('pb2')) {
    const totalBuildings = Object.values(state.buildings).reduce((a, b) => a + b, 0);
    bonus += Math.min(0.50, totalBuildings * 0.005);
  }
  if (PATCH_HAS('pc2')) bonus += 0.20;
  if (PATCH_HAS('pc4')) bonus += 1.00;
  return bonus;
}

function additiveProductionMult(resource) {
  const web = (typeof webProductionBonus === 'function') ? webProductionBonus(resource) : 0;
  const base = 1 + metaProductionBonus(resource) + patchProductionBonus(resource) + crewProductionBonus(resource) + web;
  // Wave 9: ship class multiplier applies on top of the additive stack
  const shipMult = (typeof shipProductionMult === 'function') ? shipProductionMult() : 1.0;
  // Wave 16: small ongoing Aether bonus (caps at +10%) — gives Aether a passive role
  const aetherMult = (typeof aetherProductionBonus === 'function') ? (1 + aetherProductionBonus()) : 1.0;
  return base * shipMult * aetherMult;
}

// Wave 16: ongoing Aether production bonus. Gentle log curve, capped at +10%.
function aetherProductionBonus() {
  if (!state || !state.resources) return 0;
  const a = state.resources.aether || 0;
  if (a < 1) return 0;
  // log10(a + 1) * 0.015, capped at 0.10 (+10%)
  return Math.min(0.10, Math.log10(a + 1) * 0.015);
}

// Check all milestones, award PP for newly earned ones, returns array of newly earned for toast/log.

  const newly = [];

  return newly;
}

      out[node.id] = {

        branchId: branch.id, color: branch.color, tier: node.tier,

function buyResonance(cat, qty) {

    for (let i = 0; i < branch.nodes.length - 1; i++) {
      const from = WEB_GEOMETRY[branch.nodes[i].id];
      const to = WEB_GEOMETRY[branch.nodes[i+1].id];
      const oFrom = webHas(branch.nodes[i].id);
      const oTo = webHas(branch.nodes[i+1].id);
      const active = oFrom && oTo;
      const op = active ? '0.85' : oFrom ? '0.40' : '0.10';
      lines += `<line x1="${C + from.x}" y1="${C + from.y}" x2="${C + to.x}" y2="${C + to.y}" stroke="${color}" stroke-width="${active ? 2 : 1}" opacity="${op}"/>`;
    }
    const labelX = C + Math.cos(a) * 370;
    const labelY = C + Math.sin(a) * 370;
    lines += `<text x="${labelX}" y="${labelY + 4}" text-anchor="middle" font-size="11" fill="${color}" opacity="0.85" font-family="'Syncopate', 'JetBrains Mono', monospace" letter-spacing="3" font-weight="700">${branch.name}</text>`;
  }
  const centerSigil = `
    <circle cx="${C}" cy="${C}" r="26" fill="rgba(94,226,255,0.08)" stroke="var(--cyan)" stroke-width="1.5"/>
    <text x="${C}" y="${C + 9}" text-anchor="middle" font-size="26" fill="var(--cyan)">◈</text>
  `;
  let nodesSvg = '';
  for (const node of WEB_NODES) {
    const g = WEB_GEOMETRY[node.id]; if (!g) continue;
    const owned = webHas(node.id);
    const unlockable = isWebNodeUnlockable(node);
    const canAfford = (meta.voidShards || 0) >= node.cost;
    const nx = C + g.x, ny = C + g.y;
    let circle, text, glow = '', extraClass = '';
    if (owned) {
      circle = `fill="${g.color}" stroke="#fff" stroke-width="1.5"`;
      text = `fill="#000" font-weight="700"`;
      glow = `style="filter:drop-shadow(0 0 8px ${g.color});"`;
    } else if (unlockable && canAfford) {
      circle = `fill="rgba(5,8,16,0.92)" stroke="${g.color}" stroke-width="2.5"`;
      text = `fill="${g.color}" font-weight="700"`;
      extraClass = 'afford-pulse';
      glow = `style="filter:drop-shadow(0 0 6px ${g.color});"`;
    } else if (unlockable) {
      circle = `fill="rgba(5,8,16,0.85)" stroke="${g.color}" stroke-width="1" opacity="0.55"`;
      text = `fill="${g.color}" opacity="0.6"`;
    } else {
      circle = `fill="rgba(5,8,16,0.5)" stroke="rgba(106,122,140,0.22)" stroke-width="1"`;
      text = `fill="rgba(106,122,140,0.35)"`;
    }
    const click = (!owned && unlockable) ? `onclick="buyWebNode('${node.id}')"` : '';
    const cursor = (!owned && unlockable) ? 'cursor:pointer;' : 'cursor:default;';
    nodesSvg += `
      <g class="web-node ${extraClass}" style="${cursor}" ${click}
         onmouseenter="showWebNodeDetail('${node.id}')" onmouseleave="clearWebNodeDetail()">
        <circle cx="${nx}" cy="${ny}" r="${NR}" ${circle} ${glow}/>
        <text x="${nx}" y="${ny + 4}" text-anchor="middle" font-size="12" ${text} font-family="'JetBrains Mono', monospace">${node.tier}</text>
        <title>${node.name} (${node.cost} VS) — ${node.desc}</title>
      </g>`;
  }
  const svg = `
    <svg viewBox="0 0 ${SIZE} ${SIZE}" width="100%" style="max-width:680px;display:block;margin:0 auto;">
      ${orbits}${lines}${centerSigil}${nodesSvg}
    </svg>`;
  const vs = meta.voidShards || 0;
  const totalNodes = WEB_NODES.length;
  const ownedNodes = WEB_NODES.filter(n => webHas(n.id)).length;
  return `
    <div class="tree-wrap">
      <div class="tree-svg-wrap">${svg}</div>
      <div class="tree-info">
        <div class="vs-display">
          <div class="vs-label">VOID SHARDS</div>
          <div class="vs-val">${vs}</div>
          <div class="vs-sub">INSTALLED ${ownedNodes} / ${totalNodes} · RESETS ${meta.totalResets || 0}</div>
        </div>
        <p class="tree-info-text">
          Written to your core. Survives every Void Reset.
          ${vs === 0 && (meta.totalResets || 0) === 0 ? `<br><br><span style="color:var(--magenta);">// Complete a Void Reset (Jump tab) to earn your first Void Shards.</span>` : ''}
        </p>
        <div class="ring-legend">
          ${WEB_BRANCHES.map(b => {
            const ownedB = b.nodes.filter(n => webHas(n.id)).length;
            return `<div class="ring-row" style="border-left-color:${b.color};">
              <span class="ring-name" style="color:${b.color};">${b.name}</span>
              <span class="ring-progress">${ownedB}/${b.nodes.length}</span>
            </div>`;
          }).join('')}
        </div>
        <div class="tree-node-detail" id="web-node-detail">
          <em>Hover any node to view details.</em>
        </div>
      </div>
    </div>`;
}

function showWebNodeDetail(id) {
  const el = document.getElementById('web-node-detail'); if (!el) return;
  const node = WEB_NODES.find(n => n.id === id); if (!node) return;
  const owned = webHas(id);
  const unlockable = isWebNodeUnlockable(node);
  const canAfford = (meta.voidShards || 0) >= node.cost;
  const status = owned ? '◆ INSTALLED' : (!unlockable ? '— LOCKED (need previous tier)' : (canAfford ? '◈ AFFORDABLE — CLICK TO INSTALL' : `○ NEED ${node.cost} VS`));
  el.innerHTML = `
    <div class="detail-name" style="color:${node.branchColor};">${node.name}</div>
    <div style="color:${node.branchColor};opacity:0.7;font-size:10px;letter-spacing:0.15em;margin-bottom:6px;">${node.branchName} · T${node.tier}</div>
    <div>${node.desc}</div>
    <div class="detail-cost" style="color:${owned ? 'var(--cyan-dim)' : 'var(--magenta)'};margin-top:8px;">${owned ? status : `${node.cost} VS · ${status}`}</div>`;
}
function clearWebNodeDetail() {
  const el = document.getElementById('web-node-detail');
  if (el) el.innerHTML = '<em>Hover any node to view details.</em>';
}

// --- HULL INTEGRITY ---
function damageHull(amt) {
  if (typeof state.hull !== 'number') state.hull = 100;
  state.hull = Math.max(0, state.hull - amt);
}
function repairHull(amt) {
  if (typeof state.hull !== 'number') state.hull = 100;
  state.hull = Math.min(100, state.hull + amt);
}
function hullColorClass() {
  const h = state.hull || 0;
  if (h >= 60) return 'high';
  if (h >= 30) return 'mid';
  return 'low';
}

// --- CODEX RECORDING ---
function ensureCodex() {
  if (!meta.codex) meta.codex = { anomaliesSeen: {}, sectorsLogged: {}, traitCounts: {} };
  if (!meta.codex.anomaliesSeen) meta.codex.anomaliesSeen = {};
  if (!meta.codex.sectorsLogged) meta.codex.sectorsLogged = {};
  if (!meta.codex.traitCounts)   meta.codex.traitCounts = {};
  if (!Array.isArray(meta.recentSectors)) meta.recentSectors = [];
}
function recordSectorVisit(sector) {
  ensureCodex();
  const entry = meta.codex.sectorsLogged[sector.id];
  if (!entry) {
    meta.codex.sectorsLogged[sector.id] = {
      firstJump: state.jumps || 0, traitId: sector.traitId, count: 1,
    };
  } else {
    entry.count += 1;
  }
  meta.codex.traitCounts[sector.traitId] = (meta.codex.traitCounts[sector.traitId] || 0) + 1;
  // Keep last 12 in the recentSectors map
  meta.recentSectors.unshift({ id: sector.id, traitId: sector.traitId, jump: state.jumps || 0 });
  if (meta.recentSectors.length > 12) meta.recentSectors = meta.recentSectors.slice(0, 12);
}

const ANOMALY_INTERVAL_MIN = 120 * 1000;  // 2 min
const ANOMALY_INTERVAL_MAX = 300 * 1000;  // 5 min
let lastAnomaly = Date.now();
let nextAnomalyGap = ANOMALY_INTERVAL_MIN + Math.random() * (ANOMALY_INTERVAL_MAX - ANOMALY_INTERVAL_MIN);
let _anomalyOpen = false;

function maybeAnomaly(now) {
  if (_anomalyOpen) return;
  // Wave 19: Daily Echo gets priority — fire on first eligible check
  if (typeof dailyEchoReady === 'function' && dailyEchoReady() && Object.values(state.buildings).reduce((a, b) => a + b, 0) >= 3) {
    fireDailyEcho();
    return;
  }
  if (now - lastAnomaly < nextAnomalyGap) return;
  if (Object.values(state.buildings).reduce((a, b) => a + b, 0) < 3) return;
  triggerAnomaly();
}

function triggerAnomaly() {
  const valid = ANOMALIES.filter(a => !a.triggers || a.triggers(state, meta));
  if (valid.length === 0) return;
  // Bias toward unseen
  ensureCodex();
  const seen = meta.codex.anomaliesSeen;
  const unseen = valid.filter(a => !seen[a.id]);
  const pool = unseen.length > 0 ? unseen : valid;
  const anomaly = pool[Math.floor(Math.random() * pool.length)];
  showAnomalyModal(anomaly);
}

function showAnomalyModal(anomaly) {
  _anomalyOpen = true;
  const bg = document.createElement('div');
  bg.className = 'modal-bg anomaly-bg';
  bg.innerHTML = `
    <div class="modal anomaly-modal">
      <div class="anomaly-cat">// ${anomaly.cat} ANOMALY</div>
      <div class="modal-title">${anomaly.title}</div>
      <div class="modal-body">
        <p class="anomaly-desc">${anomaly.desc}</p>
        <div class="anomaly-choices">
          ${anomaly.choices.map((c, i) => `
            <button class="anomaly-choice" data-choice="${i}">
              <div class="anomaly-choice-label">${c.label}</div>
              <div class="anomaly-choice-desc">${c.desc}</div>
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  bg.querySelectorAll('.anomaly-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-choice'), 10);
      bg.remove();
      applyAnomalyChoice(anomaly.id, idx);
    });
  });
}

function applyAnomalyChoice(anomalyId, choiceIdx) {
  const anomaly = ANOMALIES.find(a => a.id === anomalyId);
  if (!anomaly) { _anomalyOpen = false; return; }
  const choice = anomaly.choices[choiceIdx];
  if (!choice) { _anomalyOpen = false; return; }
  try {
    choice.apply(state, meta);
  } catch (e) { console.warn('anomaly apply error', e); }
  // Resolve outcome string (it may be a function in future; here always string)
  const outcomeText = typeof choice.outcome === 'function' ? choice.outcome(state, meta) : choice.outcome;
  ensureCodex();
  if (!meta.codex.anomaliesSeen[anomalyId]) {
    meta.codex.anomaliesSeen[anomalyId] = {
      firstJump: state.jumps || 0, choice: choice.label, outcome: outcomeText, count: 1,
    };
  } else {
    meta.codex.anomaliesSeen[anomalyId].count = (meta.codex.anomaliesSeen[anomalyId].count || 1) + 1;
  }
  meta.anomalyCount = (meta.anomalyCount || 0) + 1;
  pushLog(`> anomaly: ${anomaly.title.toUpperCase()} // ${choice.label}`);
  flash(`◇ ANOMALY // ${anomaly.title}`);
  // Show outcome screen
  const bg = document.createElement('div');
  bg.className = 'modal-bg anomaly-bg';
  bg.innerHTML = `
    <div class="modal anomaly-modal">
      <div class="anomaly-cat">// ${anomaly.cat} — RESOLVED</div>
      <div class="modal-title">${anomaly.title}</div>
      <div class="modal-body">
        <div class="anomaly-outcome">${outcomeText}</div>
      </div>
      <button class="modal-btn" id="anom-close">CONTINUE</button>
    </div>
  `;
  document.body.appendChild(bg);
  bg.querySelector('#anom-close').addEventListener('click', () => {
    bg.remove();
    _anomalyOpen = false;
    lastAnomaly = Date.now();
    nextAnomalyGap = ANOMALY_INTERVAL_MIN + Math.random() * (ANOMALY_INTERVAL_MAX - ANOMALY_INTERVAL_MIN);
    save(); saveMeta();
    renderAll();
  });
}

function codexHTML() {
  ensureCodex();

  const cats = ['DISCOVERY', 'ENCOUNTER', 'CRISIS', 'EXOTIC', 'STORY'];
  const catColors = {
    DISCOVERY:'var(--cyan)', ENCOUNTER:'var(--amber)', CRISIS:'var(--danger)',
    EXOTIC:'var(--magenta)', STORY:'var(--gold)',
  };

  const anomalyGroups = cats.map(cat => {
    const items = ANOMALIES.filter(a => a.cat === cat);
    return `
      <div style="margin-bottom:18px;">
        <div class="obj-cat-title" style="color:${catColors[cat]};margin-bottom:8px;">// ${cat} (${items.filter(a => seen[a.id]).length}/${items.length})</div>
        <div class="codex-grid">

            const s = seen[a.id];
            if (!s) {
              return `<div class="codex-entry locked">
                <div class="codex-entry-cat">${cat}</div>
                <div class="codex-entry-name">[ ENCRYPTED ]</div>
              </div>`;
            }
            return `<div class="codex-entry" style="border-left-color:${catColors[cat]};">
              <div class="codex-entry-cat" style="color:${catColors[cat]};">${cat}</div>
              <div class="codex-entry-name">${a.title}</div>
              <div class="codex-entry-outcome">${s.outcome}</div>
              <div class="codex-entry-meta">CHOSE: ${s.choice} · JUMP ${s.firstJump}${s.count > 1 ? ` · ×${s.count}` : ''}</div>

          }).join('')}

      </div>

  }).join('');

  // Trait breakdown
  const traitRows = SECTOR_TRAITS.map(t => {

    return `<div class="ring-row" style="border-left-color:${TRAIT_SKY[t.id]?.star || 'var(--cyan-dim)'};">
      <span class="ring-name">${t.name}</span>

  }).filter(Boolean).join('');

  return `
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="codex-summary">
        <div><span>ANOMALIES</span><strong style="color:var(--magenta);">${seenCount} / ${totalAnomalies}</strong></div>
        <div><span>SECTORS</span><strong style="color:var(--cyan);">${totalSectors}</strong></div>
        <div><span>ENCOUNTERS</span><strong>${totalAnomEnc}</strong></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start;">
        <div>${anomalyGroups}</div>
        <div style="display:flex;flex-direction:column;gap:12px;">

          ${traitRows || '<div class="empty">// none yet</div>'}

function shipUnlocked(id) {
  if (!meta.shipsUnlocked) meta.shipsUnlocked = { athena: true };
  return !!meta.shipsUnlocked[id];
}

function unlockShip(id) {
  if (!meta.shipsUnlocked) meta.shipsUnlocked = { athena: true };
  meta.shipsUnlocked[id] = true;
  saveMeta();
}

function buyShipUnlock(id) {
  const def = SHIP_DEFS[id]; if (!def || shipUnlocked(id)) return;
  if ((meta.voidShards || 0) < (def.unlockCost || 0)) return;
  meta.voidShards -= def.unlockCost;
  unlockShip(id);
  pushLog(`> ${def.name} commissioned from yard`);
  flash(`◈ SHIP UNLOCKED // ${def.name}`);
  saveMeta(); renderAll();
}

function switchShip(id) {
  if (!shipUnlocked(id)) return;
  if (meta.shipType === id) return;
  meta.shipType = id;
  // Re-seed ship art so the new class generates a fresh silhouette
  meta.shipSeed = ((Date.now() * 7 + Math.floor(Math.random() * 9973)) % 99997) + 1;
  // Refit: hull clamped to new max
  const maxH = (typeof shipMaxHull === 'function') ? shipMaxHull() : 100;
  if (state.hull > maxH) state.hull = maxH;
  pushLog(`> active vessel: ${SHIP_DEFS[id].name}`);
  flash(`◈ ACTIVE // ${SHIP_DEFS[id].name}`);
  save(); saveMeta();
  renderAll();
}

function shipYardHTML() {
  if (!meta.shipsUnlocked) meta.shipsUnlocked = { athena: true };
  const cards = Object.keys(SHIP_DEFS).map(id => {
    const def = SHIP_DEFS[id];
    const owned = shipUnlocked(id);
    const active = meta.shipType === id;
    const vs = meta.voidShards || 0;
    const canBuy = !owned && vs >= def.unlockCost;
    const previewSvg = generateShipSVG((meta.shipSeed || 1) ^ (id.length * 7919), id);
    const stats = [
      def.productionMult !== 1.0 ? `Prod ×${def.productionMult.toFixed(2)}` : null,
      def.maxCrewBonus    !== 0 ? `Crew ${def.maxCrewBonus > 0 ? '+' : ''}${def.maxCrewBonus}` : null,
      def.hullMaxBonus    !== 0 ? `Hull ${def.hullMaxBonus > 0 ? '+' : ''}${def.hullMaxBonus}%` : null,
      def.knowledgeMult   !== 1.0 ? `K ×${def.knowledgeMult.toFixed(2)}` : null,
      def.jumpHullDamageMult !== 1.0 ? `Jump dmg ×${def.jumpHullDamageMult.toFixed(2)}` : null,
    ].filter(Boolean).join(' · ');
    let actionBtn;
    if (active) {
      actionBtn = `<div style="text-align:center;padding:8px;color:var(--cyan);letter-spacing:0.2em;font-size:10px;border:1px solid var(--cyan);">◆ ACTIVE</div>`;
    } else if (owned) {
      actionBtn = `<button class="modal-btn" style="background:var(--cyan-dim);color:var(--bg);" onclick="switchShip('${id}')">BOARD VESSEL</button>`;
    } else if (canBuy) {
      actionBtn = `<button class="modal-btn" style="background:var(--magenta);" onclick="buyShipUnlock('${id}')">COMMISSION (${def.unlockCost} VS)</button>`;
    } else {
      actionBtn = `<div style="text-align:center;padding:8px;color:var(--text-dim);letter-spacing:0.2em;font-size:10px;border:1px solid var(--border);">${def.unlockCost} VS · LOCKED</div>`;
    }
    return `
      <div style="background:rgba(5,8,16,0.55);border:1px solid ${active ? 'var(--cyan)' : 'var(--border)'};padding:12px;display:flex;flex-direction:column;gap:8px;${active ? 'box-shadow:0 0 18px rgba(94,226,255,0.25);' : ''}">
        <div style="display:flex;justify-content:center;padding:8px;background:rgba(5,8,16,0.6);min-height:140px;max-height:240px;overflow:hidden;">
          ${previewSvg.replace('class="ship-ascii"', 'class="ship-ascii ship-ascii-mini"')}
        </div>
        <div style="color:${active ? 'var(--cyan)' : 'var(--text)'};font-size:11px;letter-spacing:0.18em;font-weight:500;">${def.name}</div>
        <div style="color:var(--text-dim);font-size:10px;letter-spacing:0.1em;">${def.sub.toUpperCase()}</div>
        <div style="color:var(--text);font-size:11px;line-height:1.55;">${def.desc}</div>
        ${stats ? `<div style="color:var(--cyan-dim);font-size:10px;letter-spacing:0.1em;">${stats}</div>` : ''}
        ${actionBtn}
      </div>
    `;
  }).join('');
  return `
    <div style="margin-top:18px;">
      <div class="obj-cat-title" style="margin-bottom:10px;">// SHIP YARD</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
        ${cards}
      </div>
      <p style="color:var(--text-dim);font-size:10px;margin-top:8px;line-height:1.6;">
        Commission new hulls with Void Shards. Switch any time — refit is instant. Crew and resources carry over.
      </p>
    </div>
  `;
}

function checkAchievements() {
  if (!meta.achievementsEarned) meta.achievementsEarned = {};
  const newly = [];
  for (const a of ACHIEVEMENTS) {
    if (meta.achievementsEarned[a.id]) continue;
    try {
      if (a.check(state, meta)) {
        meta.achievementsEarned[a.id] = { earnedAt: Date.now() };
        meta.voidShards = (meta.voidShards || 0) + a.vs;
        newly.push(a);
      }
    } catch (e) { /* check failed silently */ }
  }
  if (newly.length) saveMeta();
  return newly;
}

function runAutoDecrypt() {
  if (!meta.settings || !meta.settings.autoDecrypt) return;
  if (!meta.engrams || meta.engrams.length === 0) return;
  const order = ['salvage','signal','archive','relic','mythic'];
  const minIdx = order.indexOf(meta.settings.autoDecryptMinRarity || 'salvage');
  if (minIdx < 0) return;
  // Decrypt at most one per tick to keep flash flow reasonable
  for (const e of meta.engrams) {
    if (!e.encrypted) continue;
    const idx = order.indexOf(e.rarity);
    if (idx < minIdx) continue;
    const rd = ENGRAM_RARITIES.find(r => r.id === e.rarity); if (!rd) continue;
    const dmult = (typeof webDecryptCostMult === 'function') ? webDecryptCostMult() : 1.0;
    const effCost = Math.ceil(rd.kCost * dmult);
    if (state.knowledge >= effCost) {
      decryptEngram(e.uid);
      break;
    }
  }
}

// --- EXPORT / IMPORT SAVE ---
function exportSave() {
  try {
    const payload = {
      version: SAVE_VERSION,
      timestamp: Date.now(),
      state: state,
      meta: meta,
    };
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    // Show a modal with the encoded save and try to copy to clipboard
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:560px;">
        <div class="modal-title">◈ EXPORT SAVE</div>
        <div class="modal-body">
          <p style="font-size:11px;color:var(--text-dim);">Copy this string and store it somewhere safe. Paste it into IMPORT SAVE to restore.</p>
          <textarea id="export-text" readonly style="width:100%;height:160px;background:rgba(5,8,16,0.7);color:var(--cyan);border:1px solid var(--border);padding:10px;font-family:inherit;font-size:10px;resize:none;word-break:break-all;">${b64}</textarea>
          <p style="font-size:10px;color:var(--text-dim);margin-top:6px;" id="export-status">// click COPY to put it on the clipboard</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="modal-btn" id="export-copy" style="background:var(--cyan);">COPY</button>
          <button class="modal-btn" id="export-close" style="background:transparent;color:var(--text);border:1px solid var(--border);">CLOSE</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    bg.querySelector('#export-close').addEventListener('click', () => bg.remove());
    bg.querySelector('#export-copy').addEventListener('click', () => {
      const ta = bg.querySelector('#export-text');
      ta.select();
      try {
        navigator.clipboard.writeText(b64).then(() => {
          bg.querySelector('#export-status').textContent = '// copied to clipboard';
          bg.querySelector('#export-status').style.color = 'var(--cyan)';
        }).catch(() => {
          document.execCommand('copy');
          bg.querySelector('#export-status').textContent = '// copied (fallback)';
        });
      } catch (e) {
        try { document.execCommand('copy'); } catch (e2) {}
        bg.querySelector('#export-status').textContent = '// select all + copy manually if needed';
      }
    });
  } catch (e) {
    flash('export failed');
    console.warn('exportSave error', e);
  }
}

function importSave() {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:560px;border-color:var(--magenta);">
      <div class="modal-title" style="color:var(--magenta);">◈ IMPORT SAVE</div>
      <div class="modal-body">
        <p style="font-size:11px;color:var(--danger);">⚠ This OVERWRITES your current save. Export first if you want a backup.</p>
        <textarea id="import-text" placeholder="paste exported save string here…" style="width:100%;height:160px;background:rgba(5,8,16,0.7);color:var(--text);border:1px solid var(--border);padding:10px;font-family:inherit;font-size:10px;resize:none;word-break:break-all;"></textarea>
        <p style="font-size:10px;color:var(--text-dim);margin-top:6px;" id="import-status">// paste a save string and click IMPORT</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="modal-btn" id="import-do" style="background:var(--magenta);">IMPORT</button>
        <button class="modal-btn" id="import-close" style="background:transparent;color:var(--text);border:1px solid var(--border);">CANCEL</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#import-close').addEventListener('click', () => bg.remove());
  bg.querySelector('#import-do').addEventListener('click', () => {
    const txt = bg.querySelector('#import-text').value.trim();
    if (!txt) {
      bg.querySelector('#import-status').textContent = '// no data pasted'; return;
    }
    try {
      const json = decodeURIComponent(escape(atob(txt)));
      const payload = JSON.parse(json);
      if (!payload || !payload.state || !payload.meta) throw new Error('invalid structure');
      // Persist to localStorage and reload
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload.state));
      localStorage.setItem(META_KEY, JSON.stringify(payload.meta));
      bg.querySelector('#import-status').textContent = '// imported — reloading…';
      bg.querySelector('#import-status').style.color = 'var(--cyan)';
      setTimeout(() => location.reload(), 500);
    } catch (e) {
      bg.querySelector('#import-status').textContent = '// import failed: ' + (e.message || 'unknown error');
      bg.querySelector('#import-status').style.color = 'var(--danger)';
    }
  });
}

function grantOriginEngram(sourceLabel) {
  if (!meta.engrams) meta.engrams = [];

  const collectedIds = new Set(meta.engrams.filter(e => e.rarity === 'origin').map(e => e.templateId));
  const pool = ENGRAM_POOL.filter(e => e.rarity === 'origin');
  const unseen = pool.filter(e => !collectedIds.has(e.id));
  const tpl = (unseen.length > 0 ? unseen : pool)[Math.floor(Math.random() * (unseen.length > 0 ? unseen.length : pool.length))];
  if (!tpl) return;
  const engram = {
    uid: `eo_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
    templateId: tpl.id,
    rarity: 'origin',
    name: tpl.name,
    encrypted: true,
    sectorId: (state && state.sector) ? state.sector.id : '???',
    jump: (state && state.jumps) ? state.jumps : 0,
    source: sourceLabel || 'unknown',
  };
  meta.engrams.unshift(engram);
  pushLog(`> ORIGIN ENGRAM RECOVERED // ${tpl.name}`);
  flash(`◈ ORIGIN // ${tpl.name}`);
  saveMeta();
}

// --- SECTOR REVISIT ---
const SECTOR_REVISIT_COST = 25; // Knowledge cost per use

function canRevisitSector() { return state.knowledge >= SECTOR_REVISIT_COST; }
function revisitSector(sectorId) {
  if (!canRevisitSector()) return;
  const recent = (meta.recentSectors || []).find(s => s.id === sectorId);
  if (!recent) return;
  state.knowledge -= SECTOR_REVISIT_COST;
  state._forceNextSector = recent.traitId;
  meta.sectorRevisits = (meta.sectorRevisits || 0) + 1;
  saveMeta();
  pushLog(`> next jump rigged // returning to ${recent.traitId.toUpperCase()} sector type`);
  flash(`✦ NEXT JUMP // ${recent.traitId.toUpperCase()}`);
  renderAll();
}

// --- PINNED OBJECTIVE ---
function pinObjective(type, id) {
  if (!meta) return;
  if (meta.pinnedObjective && meta.pinnedObjective.type === type && meta.pinnedObjective.id === id) {
    meta.pinnedObjective = null; // toggle off
    pushLog('> pin cleared');
  } else {
    meta.pinnedObjective = { type, id };
    pushLog(`> pinned: ${type} ${id}`);
  }
  saveMeta();
  renderAll();
}
function getPinnedObjective() {
  if (!meta || !meta.pinnedObjective) return null;
  const { type, id } = meta.pinnedObjective;
  if (type === 'milestone') {
    const m = MILESTONES.find(x => x.id === id);
    if (!m) return null;
    const done = !!(meta.milestonesEarned && meta.milestonesEarned[id]);
    if (done) { meta.pinnedObjective = null; saveMeta(); return null; }
    return { type, id, name: m.name, desc: m.desc, reward: m.pp + ' VS', color: 'var(--amber)' };
  }
  if (type === 'achievement') {
    const a = ACHIEVEMENTS.find(x => x.id === id);
    if (!a) return null;
    const done = !!(meta.achievementsEarned && meta.achievementsEarned[id]);
    if (done) { meta.pinnedObjective = null; saveMeta(); return null; }
    return { type, id, name: a.name, desc: a.desc, reward: a.vs + ' VS', color: '#88ffaa' };
  }
  return null;
}

function setTheme(themeId) {
  if (!meta.settings) meta.settings = { autoDecrypt: false, autoDecryptMinRarity: 'salvage', theme: 'cyan' };
  meta.settings.theme = themeId;
  saveMeta();
  applyTheme();
  renderTabPanel();
}

function crewLevel(c) { return c.level || 1; }
function crewXP(c)    { return c.xp || 0; }
function crewMaxLevel() { return CREW_LEVEL_XP.length - 1; }

function crewXPNeededForNext(c) {
  const lvl = crewLevel(c);
  if (lvl >= crewMaxLevel()) return null;
  return CREW_LEVEL_XP[lvl + 1];
}

function crewTitle(c) {
  const titles = CREW_TITLES[c.class] || [];
  return titles[crewLevel(c) - 1] || titles[0] || '';
}

function crewLevelBonusMult(c) {
  // Each level past 1 adds +5% to that crew's bonus contributions
  return 1 + (crewLevel(c) - 1) * 0.05;
}

function awardCrewXP(amount) {
  if (!meta.crew) return;
  let leveledUp = [];
  meta.crew.forEach(c => {
    if (!c.alive) return;
    c.xp = (c.xp || 0) + amount;
    while (crewLevel(c) < crewMaxLevel() && c.xp >= CREW_LEVEL_XP[crewLevel(c) + 1]) {
      c.level = crewLevel(c) + 1;
      leveledUp.push(c);
    }
  });
  if (leveledUp.length) {
    leveledUp.forEach(c => {
      const cls = CREW_CLASSES[c.class];
      pushLog(`> ${c.name} advanced to L${crewLevel(c)} — ${crewTitle(c)}`);
      flash(`✦ LEVEL UP // ${c.name} — ${crewTitle(c)}`);
      // Random chance of triggering a memory event at certain levels
      const mems = (CREW_MEMORIES[c.class] || {})[crewLevel(c)];
      if (mems && mems.length && Math.random() < 0.75) {
        const mem = mems[Math.floor(Math.random() * mems.length)];
        setTimeout(() => showCrewMemory(c, mem), 400);
      }
    });
    saveMeta();
  }
}

// Wave 4c: COST_GROWTH lowered from 1.15 to 1.08.
// Old curve: building #50 ≈ ×1083 base cost. New curve: building #50 ≈ ×46.9 base cost,
// building #100 ≈ ×2200 base, building #500 unreachable but possible to dream about.
// This makes round-number purchases (100, 250, 500 of a building) feel achievable.
const COST_GROWTH = 1.08;
const buildingCost = (b, owned) => {
  const out = {};
  const metaMult = (typeof meta !== 'undefined' && meta) ? metaBuildingCostMult(b.id) : 1;
  // Wave 4b: Discount Schematic (pa2) — first building built (any kind) costs -50%
  const totalBuilt = (typeof state !== 'undefined' && state && state.buildings)
    ? Object.values(state.buildings).reduce((a, c) => a + c, 0) : 0;
  const patchMult = (typeof state !== 'undefined' && state) ? patchFirstBuildDiscount(totalBuilt) : 1;
  const growth = (typeof effectiveCostGrowth === 'function') ? effectiveCostGrowth() : COST_GROWTH;
  for (const [res, base] of Object.entries(b.costs)) {
    out[res] = Math.ceil(base * Math.pow(growth, owned) * metaMult * patchMult);
  }
  return out;
};
const canAffordBuilding = (b, owned, resources) => {
  const cost = buildingCost(b, owned);
  return Object.entries(cost).every(([res, amt]) => resources[res] >= amt);
};

function rollSector() {
  const totalWeight = SECTOR_TRAITS.reduce((a, t) => a + t.weight, 0);
  let r = Math.random() * totalWeight;
  let trait = SECTOR_TRAITS[0];
  for (const t of SECTOR_TRAITS) {
    r -= t.weight;
    if (r <= 0) { trait = t; break; }
  }
  const designation = SECTOR_DESIGNATIONS[Math.floor(Math.random() * SECTOR_DESIGNATIONS.length)];
  const number = String(Math.floor(Math.random() * 999) + 1).padStart(3, '0');
  const suffix = SECTOR_SUFFIX[Math.floor(Math.random() * SECTOR_SUFFIX.length)];
  return {
    id: `${designation}-${number}-${suffix}`,
    traitId: trait.id,
  };
}

let sfCanvas = null, sfCtx = null, sfStars = [], sfTraitId = 'stable', sfSpeedMult = 1;

function initStarfield() {
  sfCanvas = document.getElementById('starfield-canvas');
  if (!sfCanvas) return;
  sfCtx = sfCanvas.getContext('2d');
  sfResizeHandler();
  window.addEventListener('resize', sfResizeHandler);
  sfStars = [];
  SF_LAYERS.forEach((layer, li) => {
    for (let i = 0; i < layer.count; i++) {
      sfStars.push({
        x: Math.random() * sfCanvas.width,
        y: Math.random() * sfCanvas.height,
        size: layer.sizeMin + Math.random() * (layer.sizeMax - layer.sizeMin),
        speed: layer.baseSpeed * (0.75 + Math.random() * 0.5),
        layer: li,
        phase: Math.random() * Math.PI * 2,
      });
    }
  });
  requestAnimationFrame(sfTick);
}

function sfResizeHandler() {
  if (!sfCanvas) return;
  sfCanvas.width = window.innerWidth;
  sfCanvas.height = window.innerHeight;
}

function sfTick() {
  if (!sfCtx) return;
  const w = sfCanvas.width, h = sfCanvas.height;
  const sky = TRAIT_SKY[sfTraitId] || TRAIT_SKY.stable;
  sfCtx.clearRect(0, 0, w, h);
  for (const s of sfStars) {
    s.x -= s.speed * sfSpeedMult * sky.speed;
    if (s.x < -3) s.x = w + 3;
    s.phase += 0.018;
    const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.phase));
    const useAccent = s.layer === 2 && sky.accent;
    sfCtx.globalAlpha = alpha;
    sfCtx.fillStyle = useAccent ? sky.accent : sky.star;
    sfCtx.beginPath();
    sfCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    sfCtx.fill();
    // streak on fastest layer
    if (s.layer === 2) {
      sfCtx.globalAlpha = alpha * 0.25;
      sfCtx.fillRect(s.x, s.y - s.size * 0.3, s.speed * sfSpeedMult * sky.speed * 6, s.size * 0.5);
    }
  }
  sfCtx.globalAlpha = 1;
  requestAnimationFrame(sfTick);
}

function updateStarfieldTrait(traitId) {
  sfTraitId = traitId || 'stable';
}

// --- KNOWLEDGE ----------------------------------------------
// Wave 4d: base coefficient dropped from 0.25 to 0.05. Old curve gave ×4.95 at k=250;
// new curve gives ×1.79. Combined with the new log-based gain formula (in computeKnowledgeGain),
// this brings Jump 5 multiplier from ~×4.5 to ~×1.4 — close to the "+30% at Jump 5" target
// from Wave 4c's open questions. Causal Engineering (EXO T5) still triples the base.
//
// Curve points under new formula `1 + sqrt(k) * 0.05`:
//   k=10  → ×1.16    k=50  → ×1.35    k=100 → ×1.50
//   k=250 → ×1.79    k=500 → ×2.12    k=1000 → ×2.58
const KNOWLEDGE_BASE = 0.05;
function knowledgeMult(s) {
  const base = (s && s._causalEng) ? KNOWLEDGE_BASE * 3 : KNOWLEDGE_BASE;
  const k = s ? s.knowledge : 0;
  return 1 + Math.sqrt(k) * base;
}
// legacy alias for any old callers (matches new sqrt curve)
const KNOWLEDGE_MULT = (k) => 1 + Math.sqrt(k) * KNOWLEDGE_BASE;

function seededRng(seed) {
  let s = ((seed ^ 0xDEAD) >>> 0) || 1;
  return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 0x100000000; };
}
