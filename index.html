// Renderer: returns HTML <pre> (the function name stays generateShipSVG for callers).
function generateShipSVG(seed, type='athena') {
  const def = SHIP_DEFS[type] || SHIP_DEFS.athena;
  const template = SHIP_TEMPLATES[type] || SHIP_TEMPLATES.athena;
  const rng = seededRng(seed || 1);
  // Seeded detail variation: some cargo blocks vanish, some heavy plates lighten.
  const lines = template.map(line => {
    let out = '';
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '▣' && rng() < 0.25) out += ' ';
      else if (ch === '█' && rng() < 0.18) out += '▓';
      else if (ch === '▓' && rng() < 0.10) out += '▒';
      else out += ch;
    }
    return out;
  });
  // Wrap characters in spans so CSS can color them.
  const colored = lines.map(line => {
    let out = '';
    for (const ch of line) {
      if (ch === '▼')      out += `<span class="s-eng">${ch}</span>`;
      else if (ch === '█') out += `<span class="s-ec">${ch}</span>`;
      else if (ch === '▓') out += `<span class="s-hi">${ch}</span>`;
      else if (ch === '▒') out += `<span class="s-md">${ch}</span>`;
      else if (ch === '░') out += `<span class="s-lo">${ch}</span>`;
      else if (ch === '▣') out += `<span class="s-cg">${ch}</span>`;
      else if (ch === ' ') out += ' ';
      else                 out += `<span class="s-fr">${ch}</span>`;
    }
    return out;
  }).join('\n');
  return `<pre class="ship-ascii" style="--ship-c:${def.accent};--ship-eng:${def.engine};--ship-ck:${def.cockpit};">${colored}</pre>`;
}

function rollEngramRarity() {
  const total = ENGRAM_RARITIES.reduce((a, r) => a + r.weight, 0);
  let rand = Math.random() * total;
  for (const r of ENGRAM_RARITIES) { rand -= r.weight; if (rand <= 0) return r.id; }
  return 'salvage';
}

function rollEngrams(sectorTraitId, sectorId, jumpNumber) {
  let count = 1;
  if (sectorTraitId === 'singular' || sectorTraitId === 'dead') count++;
  if (Math.random() < 0.12) count++;
  // Wave 7: signal_t1 grants +1 engram per jump
  if (typeof webExtraEngrams === 'function') count += webExtraEngrams();
  const result = [];
  for (let i = 0; i < count; i++) {
    const rarity = rollEngramRarity();
    const pool = ENGRAM_POOL.filter(e => e.rarity === rarity);
    const tpl = pool[Math.floor(Math.random() * pool.length)];
    result.push({
      uid: `e_${Date.now()}_${i}_${Math.random().toString(36).slice(2,6)}`,
      templateId: tpl.id,
      rarity,
      name: tpl.name,
      encrypted: true,
      sectorId,
      jump: jumpNumber,
    });
  }
  return result;
}

function decryptEngram(uid) {
  if (!meta.engrams) return;
  const engram = meta.engrams.find(e => e.uid === uid);
  if (!engram || !engram.encrypted) return;
  const rarityDef = ENGRAM_RARITIES.find(r => r.id === engram.rarity);
  if (!rarityDef) return;
  const dmult = (typeof webDecryptCostMult === 'function') ? webDecryptCostMult() : 1.0;
  const effCost = Math.ceil(rarityDef.kCost * dmult);
  if (state.knowledge < effCost) return;
  state.knowledge -= effCost;
  engram.encrypted = false;
  const tpl = ENGRAM_POOL.find(t => t.id === engram.templateId);
  if (tpl && tpl.reward && tpl.reward.type === 'pp') {
    // Wave 15: PP retired — engram rewards convert to Void Shards at 1:1
    meta.voidShards = (meta.voidShards || 0) + tpl.reward.val;
    pushLog(`> engram decrypted: ${engram.name} // +${tpl.reward.val} VS`);
    flash(`◈ DECRYPTED // ${engram.name} // +${tpl.reward.val} VS`);
  }
  saveMeta();
  save();
  renderAll();
}

  medic:     { name:'Medic',     sym:'✚', color:'#88ffaa',        desc:'Converts one fatal hit to injury',    weight:  8 },
  echo:      { name:'Echo',     sym:'◌', color:'var(--cyan-dim)', desc:'+5% all production, cannot die',      weight:  0 },
};

const CREW_FIRST = ['Ara','Solin','Dessa','Korvus','Mira','Talon','Vex','Lysa','Orik','Phen',
                    'Zara','Elu','Kyron','Nessa','Drak','Sable','Torv','Asha','Fen','Calix',
                    'Riven','Thane','Vel','Skor','Ona','Liss','Bray','Cael','Dessa','Mori'];
const CREW_LAST  = ['Marsh','Vael','Orin','Tessra','Keld','Sivon','Drach','Morrow','Lune','Ferin',
                    'Kova','Dast','Sevra','Orlen','Wick','Hale','Trev','Sorn','Lach','Vorn',
                    'Asel','Brek','Cade','Dorn','Eld','Fenn','Grale','Holt','Iver','Jast'];

function crewProductionBonus(resource) {
  if (!meta || !meta.crew) return 0;
  let bonus = 0;
  meta.crew.filter(c => c.alive && !c.injured).forEach(c => {
    const lvlMult = (typeof crewLevelBonusMult === 'function') ? crewLevelBonusMult(c) : 1.0;
    if (c.class === 'engineer') bonus += 0.15 * lvlMult;
    if (c.class === 'scientist') { bonus += 0.10 * lvlMult; if (resource === 'data') bonus += 0.10 * lvlMult; }
    if (c.class === 'ghost') bonus += 0.08 * lvlMult;
    if (c.class === 'echo')  bonus += 0.05 * lvlMult;
  });
  if (typeof shipCrewBonusBoost === 'function') bonus *= shipCrewBonusBoost();
  // Wave 15: Resonance CREW multiplier (per-point bonus)
  if (typeof resCrewBonusMult === 'function') bonus *= resCrewBonusMult();
  return bonus;
}

function crewNavigatorBonus() {
  if (!meta || !meta.crew) return 0;
  return meta.crew.filter(c => c.alive && !c.injured && c.class === 'navigator').length * 0.15;
}

function crewGhostEngramBonus() {
  if (!meta || !meta.crew) return 0;
  return meta.crew.filter(c => c.alive && !c.injured && c.class === 'ghost').length;
}

function rollCrewmate(sectorTraitId, jumpNumber) {
  const maxCrew = (typeof webMaxCrew === 'function') ? webMaxCrew() : 4;
  const activeCrew = (meta.crew || []).filter(c => c.alive).length;
  if (activeCrew >= maxCrew) return null;

  let chance = 0.22;
  if (sectorTraitId === 'signal') chance = 0.40;
  if (sectorTraitId === 'dead')   chance = 0.32;
  if (sectorTraitId === 'singular') chance = 0.07;
  if (Math.random() > chance) return null;

  const classList = Object.entries(CREW_CLASSES);
  const total = classList.reduce((a, [, v]) => a + v.weight, 0);
  let r = Math.random() * total;
  let cls = classList[0][0];
  for (const [id, def] of classList) { r -= def.weight; if (r <= 0) { cls = id; break; } }

  const first = CREW_FIRST[Math.floor(Math.random() * CREW_FIRST.length)];
  const last  = CREW_LAST [Math.floor(Math.random() * CREW_LAST.length)];
  return {
    id: `c_${Date.now()}_${Math.random().toString(36).slice(2,5)}`,
    name: `${first} ${last}`,
    class: cls,
    alive: true,
    injured: false,
    injuredUntil: null,
    joinedJump: jumpNumber,
    // Wave 10: leveling
    level: 1,
    xp: 0,
  };
}

function applyJumpConsequences(traitId, jumpsDone) {
  if (!meta.crew || meta.crew.length === 0) return null;
  // Heal recovered crew first
  meta.crew.forEach(c => {
    if (c.injured && c.injuredUntil != null && jumpsDone >= c.injuredUntil) {
      c.injured = false; c.injuredUntil = null;
    }
  });
  const active = meta.crew.filter(c => c.alive && !c.injured && c.class !== 'echo');
  if (active.length === 0) return null;

  let hitChance = 0, fatalChance = 0;
  if (traitId === 'singular') { hitChance = 0.42; fatalChance = 0.55; }
  else if (traitId === 'dead') { hitChance = 0.26; fatalChance = 0.30; }
  if (!hitChance || Math.random() > hitChance) return null;

  const hasMedic = meta.crew.some(c => c.alive && !c.injured && c.class === 'medic');
  const target = active[Math.floor(Math.random() * active.length)];

  const recoveryTime = (typeof webCrewRecoveryJumps === 'function') ? webCrewRecoveryJumps() : 2;
  if (Math.random() < fatalChance) {
    if (hasMedic) {
      target.injured = true; target.injuredUntil = jumpsDone + recoveryTime;
      return { type: 'saved', name: target.name };
    }
    // Wave 15: CREW mastery — fatal hits become permanent-feeling injuries (crew can't die)
    if (typeof resCrewImmortal === 'function' && resCrewImmortal()) {
      target.injured = true; target.injuredUntil = jumpsDone + 3;
      return { type: 'saved', name: target.name };
    }
    target.alive = false;
    return { type: 'death', name: target.name, class: target.class };
  }
  target.injured = true; target.injuredUntil = jumpsDone + recoveryTime;
  return { type: 'injury', name: target.name };
}

// --- STATE --------------------------------------------------
function freshRun(carryKnowledge = 0, carryJumps = 0) {
  const sector = rollSector();
  const trait = getTrait(sector.traitId);
  const isFirstRun = carryJumps === 0;
  const log = [];
  if (isFirstRun) {
    log.push({ t: Date.now(), msg: '> SYSTEM BOOT // void protocol v2 // standby' });
    log.push({ t: Date.now() - 1, msg: '> derelict.ai awakening // self-diagnostic clean' });
    log.push({ t: Date.now() - 2, msg: `> arrived: ${sector.id} // ${trait.name.toUpperCase()}` });
  } else {
    log.push({ t: Date.now(), msg: `> JUMP ${carryJumps} COMPLETE // arrived ${sector.id}` });
    log.push({ t: Date.now() - 1, msg: `> local conditions: ${trait.name.toUpperCase()}` });
    if (trait.id !== 'stable') {
      log.push({ t: Date.now() - 2, msg: `> // ${trait.desc.toLowerCase()}` });
    }
  }
  const startEnergy = (meta && typeof metaStartingEnergy === 'function') ? metaStartingEnergy() : 0;
  const startClick  = (meta && typeof metaStartingClickPower === 'function') ? metaStartingClickPower() : 1;
  const now = Date.now();
  return {
    version: SAVE_VERSION,
    resources: { energy: startEnergy, data: 0, alloy: 0, plasma: 0, aether: 0 },
    buildings: Object.fromEntries(BUILDINGS.map(b => [b.id, 0])),
    upgrades: {},
    unlocked: { data: false, alloy: false, plasma: false, prestige: false, aether: false },
    mult: Object.fromEntries(BUILDINGS.map(b => [b.id, 1])),
    clickPower: startClick,
    knowledge: carryKnowledge,
    jumps: carryJumps,
    sector,
    log,
    lastSave: now,
    // Wave 4b additions
    runStartTime: now,                          // for time-gated patch effects
    patchPoints: 0,                             // per-run currency
    patchOwned: {},                             // { patchId: true }
    challenges: rollChallenges(),               // [challengeId, ...] picked at run start
    challengeProgress: {},                      // { challengeId: { progress, done, pulses } }
    cascadeAccum: 0,                            // accumulator for nerfed Pulse Cascade (30s trickle)
    // Wave 8
    hull: 100,                                  // ship hull integrity (0-100)
  };
}

let state = null;
let pulseFlash = false;
let saveFlash = false;
let saveFlashTimeout = null;

// --- SAVE / LOAD --------------------------------------------
function save() {
  try {
    state.lastSave = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    saveFlash = true;
    clearTimeout(saveFlashTimeout);
    saveFlashTimeout = setTimeout(() => { saveFlash = false; renderHeader(); }, 500);
  } catch (e) {
    console.warn('save failed', e);
  }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.version || parsed.version < SAVE_VERSION) {
      const oldVer = parsed.version || 1;
      console.log('migrating save from v' + oldVer + ' to v' + SAVE_VERSION);
      // For v1→v3 jumps, reset run state but preserve Knowledge and Jumps (legacy behavior).
      // For v3→v4 (Wave 4b), do an IN-PLACE migration: keep the player's current run intact
      // and just graft on the new fields so they don't lose progress mid-run.
      if (oldVer === 3) {
        const now = Date.now();
        parsed.version = SAVE_VERSION;
        if (typeof parsed.runStartTime !== 'number') parsed.runStartTime = now;
        if (typeof parsed.patchPoints !== 'number') parsed.patchPoints = 0;
        if (!parsed.patchOwned || typeof parsed.patchOwned !== 'object') parsed.patchOwned = {};
        if (!Array.isArray(parsed.challenges) || parsed.challenges.length === 0) parsed.challenges = rollChallenges();
        if (!parsed.challengeProgress || typeof parsed.challengeProgress !== 'object') parsed.challengeProgress = {};
        if (typeof parsed.cascadeAccum !== 'number') parsed.cascadeAccum = 0;
        if (meta && (parsed.jumps || 0) > meta.totalJumps) {
          meta.totalJumps = parsed.jumps;
          saveMeta();
        }
        return parsed;
      }
      // Wave 4c (v4→v5): pure in-place migration. State shape unchanged; only formulas
      // (knowledge curve, building costs, Aether bonus, Singularity Protocol, additive stacking)
      // differ. Player's mid-run state stays valid; production numbers will recompute next tick.
      if (oldVer === 4) {
        parsed.version = 5;
      }
      // Wave 4d (v5→v6): in-place migration. Adds two new building keys (tokamak, bottle)
      // to state.buildings and state.mult with default 0/1. Knowledge gain formula and
      // multiplier coefficient also changed — these recompute on next tick automatically.
      // No resource resets, no PP refunds, no challenge resets.
      if (oldVer === 4 || oldVer === 5) {
        parsed.version = SAVE_VERSION;
        if (!parsed.buildings) parsed.buildings = {};
        if (!parsed.mult) parsed.mult = {};
        for (const b of BUILDINGS) {
          if (!(b.id in parsed.buildings)) parsed.buildings[b.id] = 0;
          if (!(b.id in parsed.mult)) parsed.mult[b.id] = 1;
        }
        return parsed;
      }
      // Wave 7-15: in-place migration.
      if (oldVer >= 6 && oldVer <= 19) {
        parsed.version = SAVE_VERSION;
        if (typeof parsed.hull !== 'number') parsed.hull = 100;
        // Wave 15: auto-buy data is no longer used; remove it
        delete parsed.autoBuy;
        return parsed;
      }
      // Pre-v3 saves: reset run, preserve Knowledge and Jumps as before
      const fresh = freshRun(parsed.knowledge || 0, parsed.jumps || 0);
      if (meta && (parsed.jumps || 0) > meta.totalJumps) {
        meta.totalJumps = parsed.jumps;
        saveMeta();
      }
      return fresh;
    }
    return parsed;
  } catch (e) {
    console.warn('load failed', e);
    return null;
  }
}

function applyOfflineProgress(s) {
  const now = Date.now();
  const cap = (typeof meta !== 'undefined' && meta) ? metaOfflineCap() : MAX_OFFLINE_SECONDS;
  const elapsed = Math.min((now - s.lastSave) / 1000, cap);
  if (elapsed < 5) return null;
  const trait = getTrait(s.sector.traitId);
  const kMult = knowledgeMult(s);
  // Wave 4c: additive stacking — swap state temporarily so PATCH_HAS works against `s`
  const prevState = state;
  state = s;
  const gains = { energy: 0, data: 0, alloy: 0, plasma: 0, aether: 0 };
  BUILDINGS.forEach(b => {
    const count = s.buildings[b.id];
    if (count > 0) {
      const traitMod = trait.mods[b.produces] || 1;
      const addMult = additiveProductionMult(b.produces);  // combined meta+patch bonuses
      const plasmaDouble = patchPlasmaDoubler(b.produces);
      const rate = b.rate * count * s.mult[b.id] * kMult * traitMod * addMult * plasmaDouble;
      gains[b.produces] += rate * elapsed;
    }
  });
  state = prevState;
  let any = false;
  for (const r of RESOURCE_LIST) {
    if (gains[r] > 0) { s.resources[r] += gains[r]; any = true; }
  }
  return any ? { elapsed, gains } : null;
}

// --- HELPERS ------------------------------------------------
function pushLog(msg) {
  state.log = [{ t: Date.now(), msg }, ...state.log].slice(0, 8);
}

function flash(msg) {
  const el = document.createElement('div');
  el.className = 'toast';

function showModal(title, bodyHTML, buttonText, onClose) {

    <div class="modal">

      <div class="modal-body">${bodyHTML}</div>

    </div>

  bg.querySelector('.modal-btn').addEventListener('click', () => {
    bg.remove();
    if (onClose) onClose();

}

// --- ACTIONS ------------------------------------------------
function pulse() {
  doPulseLogic(true);
}

function doPulseLogic(visual) {
  if (visual) {
    const reactor = document.querySelector('.reactor');
    if (reactor) {
      reactor.classList.add('pulse');
      setTimeout(() => reactor.classList.remove('pulse'), 150);
    }
  }
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  const traitMod = trait.mods.energy || 1;
  // Wave 4c: additive production stacking applies to pulse base too
  const addMult = additiveProductionMult('energy');
  const clickMetaMult = metaClickMult();  // r3_force ×2 — stays multiplicative (click-specific)
  // Distributed Mind (CMP5): pulse × Mainframes
  const dmMult = state._distributedMind ? Math.max(1, state.buildings.mainframe) : 1;
  // Pulse Synergy (r3_synergy): stacks with CMP5
  const synMult = metaHas('r3_synergy') ? Math.max(1, state.buildings.mainframe) : 1;
  // Critical Pulse (r3_crit): 5% chance ×10
  let critMult = 1;
  if (metaHas('r3_crit') && Math.random() < 0.05) {
    critMult = 10;
    if (visual) flash('◈ CRITICAL PULSE ×10');
  }
  // Wave 15: PULSE mastery adds +5% crit chance (x5)
  let webCritMult = 1;
  const masterCrit = (typeof resPulseCritBonus === 'function') ? resPulseCritBonus() : 0;
  if (masterCrit > 0 && Math.random() < masterCrit) {
    webCritMult = 5;
    if (visual) flash('◈ RESONANCE CRIT ×5');
  }
  // Wave 7: web pulse bonuses
  const webBase = (typeof webClickBonus === 'function') ? webClickBonus() : 0;
  const webMult = (typeof webClickMult === 'function') ? webClickMult() : 1;
  const baseClick = (state.clickPower + webBase) * kMult * traitMod * addMult * clickMetaMult * dmMult * synMult * critMult * webCritMult * webMult
                  * patchClickMult() * patchPulseEarlyBonus();
  state.resources.energy += baseClick;
  // Wave 4b: track pulses for per-run challenges
  if (state.challenges && state.challenges.length) {
    for (const cid of state.challenges) {
      if (!state.challengeProgress[cid]) state.challengeProgress[cid] = { progress: 0, done: false, pulses: 0 };
      state.challengeProgress[cid].pulses = (state.challengeProgress[cid].pulses || 0) + 1;
    }
  }
  // Pulse Cascade (Wave 4b): moved from click-triggered (1s/click) to passive
  // trickle (0.1s every 30s) — see tick() for the new behavior.
  // Singularity Protocol (CMP6, Wave 4c rewrite): was 0.1% of current Data → exploit (any
  // big Data stash made each pulse worth millions). Now: flat +5 Plasma per Mainframe owned.
  // No exponential scaling. Useful boost for CMP-branch builders, capped by building count.
  if (state._singularityProtocol) {
    state.resources.plasma += 5 * (state.buildings.mainframe || 0);
  }
  renderResources();
  renderReactor();
}

// --- BULK BUY -----------------------------------------------
let buyQty = 1; // 1, 10, 100, or 0 = MAX

function setBuyQty(n) {
  buyQty = n;
  renderTabPanel();
}

function buildingCostBulk(b, owned, qty) {
  // Geometric series: sum of base*g^owned to base*g^(owned+qty-1)
  const out = {};
  const metaMult = (typeof meta !== 'undefined' && meta) ? metaBuildingCostMult(b.id) : 1;
  const totalBuilt = (typeof state !== 'undefined' && state && state.buildings)
    ? Object.values(state.buildings).reduce((a, c) => a + c, 0) : 0;
  const patchMult = (typeof state !== 'undefined' && state) ? patchFirstBuildDiscount(totalBuilt) : 1;
  const g = (typeof effectiveCostGrowth === 'function') ? effectiveCostGrowth() : COST_GROWTH;
  for (const [res, base] of Object.entries(b.costs)) {
    const adj = base * metaMult * patchMult;
    const total = adj * Math.pow(g, owned) * (Math.pow(g, qty) - 1) / (g - 1);
    out[res] = Math.ceil(total);
  }
  return out;
}

function maxAffordable(b, owned, resources) {
  // Binary search for largest qty we can afford
  let lo = 0, hi = 1000;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    const cost = buildingCostBulk(b, owned, mid);
    if (Object.entries(cost).every(([res, amt]) => (resources[res] || 0) >= amt)) {
      lo = mid;
    } else {
      hi = mid - 1;
    }
  }
  return lo;
}

function canAffordBuildingN(b, owned, resources, qty) {
  const cost = buildingCostBulk(b, owned, qty);
  return Object.entries(cost).every(([res, amt]) => (resources[res] || 0) >= amt);
}

function buyBuilding(id) {
  const b = BUILDINGS.find(x => x.id === id);
  const owned = state.buildings[b.id];
  const qty = buyQty === 0 ? maxAffordable(b, owned, state.resources) : buyQty;
  if (qty <= 0) return;
  if (!canAffordBuildingN(b, owned, state.resources, qty)) return;
  const cost = buildingCostBulk(b, owned, qty);
  for (const [res, amt] of Object.entries(cost)) state.resources[res] -= amt;
  const prevOwned = state.buildings[b.id];
  state.buildings[b.id] += qty;
  if (prevOwned === 0) {
    const flavor = FIRST_BUILD_FLAVOR[b.id] || `> deployed: ${b.name.toUpperCase()}`;
    pushLog(flavor);
  } else if (Math.floor(prevOwned / 25) < Math.floor(state.buildings[b.id] / 25)) {
    pushLog(`> ${b.name} ×${state.buildings[b.id]} // production scaling`);
  }
  save();
  renderAll();
}

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (state.upgrades[u.id]) return;
  if (u.req.some(r => !state.upgrades[r])) return;
  for (const [res, amt] of Object.entries(u.cost)) {
    if (state.resources[res] < amt) return;
  }
  // capture unlocked-state before applying so we know what's new
  const before = { ...state.unlocked };
  for (const [res, amt] of Object.entries(u.cost)) state.resources[res] -= amt;
  state.upgrades[u.id] = true;
  u.apply(state);
  pushLog(`> research complete: ${u.name.toUpperCase()}`);
  // detect new resource unlocks and push flavor
  for (const r of ['data', 'alloy', 'plasma', 'aether']) {
    if (state.unlocked[r] && !before[r] && RESOURCE_UNLOCK_FLAVOR[r]) {
      pushLog(RESOURCE_UNLOCK_FLAVOR[r]);
    }
  }
  if (state.unlocked.prestige && !before.prestige) {
    pushLog('> stellar cartography online // JUMP CAPABILITY ACQUIRED');
  }
  flash(`◆ ${u.name} acquired`);
  save();
  renderAll();
}

function computeKnowledgeGain() {
  const trait = getTrait(state.sector.traitId);
  let jumpMult = trait.jumpMult || 1;
  // Wave 4b: Dead Zone Hunter (pc3) raises Dead Zone's jump bonus from ×1.5 to ×2
  if (state.sector.traitId === 'dead') {
    jumpMult = patchDeadZoneBonus();
  }
  const totalScore = state.resources.plasma + state.resources.alloy / 10 + state.resources.data / 100;
  // Wave 4d: gain reshaped from `floor(sqrt(totalScore / 100))` (which produced 151 K
  // from a ~2.3M score) to `floor(log10(totalScore / 10) * 2.5)`. The log curve grows
  // by roughly +2.5 per 10× of accumulated score, capping de facto around 20 K per
  // jump even at galactic-scale totals. Same 2.3M score now yields 13 K.
  //
  // Curve points (stable sector, jumpMult=1):
  //   score=1K  →  5 K    score=10K  →  7 K    score=100K → 10 K
  //   score=1M  → 12 K    score=10M  → 15 K    score=100M → 17 K
  //
  // Floor: scores below 1000 give 0 K. Prevents farming early-game jumps for free
  // Knowledge during the first run when Plasma is still in the single digits.
  let base = 0;
  if (totalScore >= 1000) {
    base = Math.floor(Math.log10(totalScore / 10) * 2.5 * jumpMult);
  }
  // Wave 16: Aether Knowledge bonus capped at +25 per jump (was unbounded sqrt — too snowbally).
  // New formula: floor(sqrt(Aether) / 2), capped at 25. Reaches the cap at ~2500 Aether.
  const aetherBonus = metaHas('r4_aetheric')
    ? Math.min(25, Math.floor(Math.sqrt(Math.max(0, state.resources.aether)) / 2))
    : 0;
  // Wave 4b: Star Mapper (pb4) +25% Knowledge gained
  const patchBonus = patchJumpKnowledgeBonus();
  const navBonus = 1 + crewNavigatorBonus();
  const webBonus = 1 + ((typeof webKnowledgeBonus === 'function') ? webKnowledgeBonus() : 0);
  const shipMult = (typeof shipKnowledgeMult === 'function') ? shipKnowledgeMult() : 1.0;
  return Math.floor((base + aetherBonus) * patchBonus * navBonus * webBonus * shipMult);
}

function jumpKnowledgeCostMult() {
  // Wave 4b: Glass Cannon (pc4) — Jump knowledge cost +50% (used by UI / future cost gate)
  return patchGlassCannonJumpPenalty();
}

function doJump() {
  const gain = computeKnowledgeGain();
  if (gain < 1) return;
  const newK = state.knowledge + gain;
  const newJumps = state.jumps + 1;
  // Capture departing sector before freshRun resets it
  const departingTraitId = state.sector.traitId;
  const departingSectorId = state.sector.id;
  // Wave 8: hull damage/repair based on departing sector trait. Wave 9 ship modifies damage.
  const wasHull = state.hull == null ? 100 : state.hull;
  const dmgMult = (typeof shipJumpDamageMult === 'function') ? shipJumpDamageMult() : 1.0;
  if (departingTraitId === 'singular')      damageHull(Math.round(18 * dmgMult));
  else if (departingTraitId === 'dead')     damageHull(Math.round(10 * dmgMult));
  else if (departingTraitId === 'signal')   damageHull(Math.round(4 * dmgMult));
  else if (departingTraitId === 'stable')   repairHull(6);
  else if (departingTraitId === 'resonance')repairHull(10);
  // Cap hull at ship's max
  const maxH = (typeof shipMaxHull === 'function') ? shipMaxHull() : 100;
  if (state.hull > maxH) state.hull = maxH;
  // At zero hull, lose 20% of each building (round down) before transit
  if (wasHull > 0 && state.hull === 0) {
    let lost = 0;
    for (const b of BUILDINGS) {
      const owned = state.buildings[b.id] || 0;
      const dec = Math.floor(owned * 0.20);
      if (dec > 0) { state.buildings[b.id] -= dec; lost += dec; }
    }
    if (lost > 0) {
      pushLog(`> CATASTROPHIC HULL FAILURE // -${lost} buildings lost to vacuum`);
      flash(`⚠ HULL FAILURE // -${lost} BUILDINGS LOST`);
    }
    state.hull = 25;
    // Wave 11: track survival of hull-zero event
    if (!meta.lifetimeStats) meta.lifetimeStats = {};
    meta.lifetimeStats.hullZeroSurvived = true;
  }

  // Apply sector consequences to crew (injury/death) before we leave
  const consequence = applyJumpConsequences(departingTraitId, newJumps);
  if (consequence) {
    if (consequence.type === 'death')
      pushLog(`> CASUALTY // ${consequence.name} [${consequence.class}] // lost in transit`);
    else if (consequence.type === 'injury')
      pushLog(`> INJURY // ${consequence.name} // incapacitated`);
    else if (consequence.type === 'saved')
      pushLog(`> MEDIC INTERVENED // ${consequence.name} // injured, not lost`);
    else if (consequence.type === 'echo') {
      pushLog(`> ECHO BINDING // ${consequence.name} reborn as Echo // immortal`);
      flash(`◌ ECHO // ${consequence.name}`);
    }
  }

  // Roll engrams — Ghost crew members add +1 each
  if (!meta.engrams) meta.engrams = [];
  const ghostBonus = crewGhostEngramBonus();
  const newEngrams = rollEngrams(departingTraitId, departingSectorId, newJumps);
  for (let g = 0; g < ghostBonus; g++) {
    const extras = rollEngrams(departingTraitId, departingSectorId, newJumps);
    if (extras.length) newEngrams.push(extras[0]);
  }
  meta.engrams.unshift(...newEngrams);
  if (meta.engrams.length > 60) meta.engrams = meta.engrams.slice(0, 60);

  // Roll for a new crewmate in the arriving sector
  meta.totalJumps = (meta.totalJumps || 0) + 1;
  if (newK > meta.lifetimeKnowledgeMax) meta.lifetimeKnowledgeMax = newK;
  // Wave 10: jumps grant +4 XP to every alive crew
  if (typeof awardCrewXP === 'function') awardCrewXP(4);
  // Wave 8: capture state values needed AFTER freshRun rebuilds state
  const carriedHull = state.hull;  // post-damage value
  const forced = state._forceNextSector;
  state = freshRun(newK, newJumps);
  state.hull = Math.max(0, Math.min(100, carriedHull));
  if (forced) {
    const trait = SECTOR_TRAITS.find(t => t.id === forced);
    if (trait) state.sector.traitId = forced;
  }
  meta.traitsVisited[state.sector.traitId] = true;
  // Wave 9: cosmic phenomenon check — overrides sector trait if milestone hit
  if (typeof checkPhenomenonOnArrival === 'function') {
    const phen = checkPhenomenonOnArrival();
    if (phen) {
      state._pendingPhenomenon = phen.id;
    }
  }
  if (typeof recordSectorVisit === 'function') recordSectorVisit(state.sector);

  const newCrew = rollCrewmate(state.sector.traitId, newJumps);
  if (newCrew) {
    if (!meta.crew) meta.crew = [];
    meta.crew.push(newCrew);
    const crewCls = CREW_CLASSES[newCrew.class];
    pushLog(`> SURVIVOR FOUND // ${newCrew.name} [${crewCls ? crewCls.name : newCrew.class}] // aboard`);
    flash(`✚ CREW // ${newCrew.name} — ${crewCls ? crewCls.name : newCrew.class}`);
  }

  updateStarfieldTrait(state.sector.traitId);
  saveMeta();
  const engramWord = newEngrams.length === 1 ? 'ENGRAM' : 'ENGRAMS';
  flash(`✦ JUMPED // +${gain} KNOWLEDGE // ${newEngrams.length} ${engramWord} RECEIVED`);
  pushLog(`> ${newEngrams.length} engram${newEngrams.length !== 1 ? 's' : ''} recovered from ${departingSectorId}`);
  // Run milestone check after jump (totalJumps may unlock some)
  const newMs = checkMilestones();
  for (const m of newMs) pushLog(`> milestone: ${m.name} // +${m.pp} VS`);
  save();
  currentTab = 'build';
  renderAll();
  // Wave 9: if there's a pending cosmic phenomenon, trigger after a beat
  if (state._pendingPhenomenon) {
    const phen = COSMIC_PHENOMENA.find(p => p.id === state._pendingPhenomenon);
    state._pendingPhenomenon = null;
    if (phen) setTimeout(() => showPhenomenonModal(phen), 400);
  }
}

function hardReset() {
  const wipeMeta = confirm(
    'Wipe current run progress?\n\n' +
    '• OK = wipe current run (Knowledge, resources, buildings). Keeps Protocols, milestones, and PP.\n' +
    '• Cancel = back out.\n\n' +
    'After this, you\'ll get a second prompt asking whether to wipe ALL meta-progression too.'
  );
  if (!wipeMeta) return;
  const wipeAll = confirm(
    'ALSO wipe permanent progression?\n\n' +
    '• OK = NUKE EVERYTHING. All Protocols, milestones, and PP gone forever.\n' +
    '• Cancel = wipe current run only, keep meta-progression intact.'
  );
  localStorage.removeItem(SAVE_KEY);
  if (wipeAll) {
    localStorage.removeItem(META_KEY);
    meta = freshMeta();
  }
  state = freshRun(0, 0);
  save();
  saveMeta();
  renderAll();
}

function getProduction() {
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  const out = { energy: 0, data: 0, alloy: 0, plasma: 0, aether: 0 };
  BUILDINGS.forEach(b => {
    const traitMod = trait.mods[b.produces] || 1;
    const addMult = additiveProductionMult(b.produces);   // Wave 4c
    const plasmaDouble = patchPlasmaDoubler(b.produces);
    out[b.produces] += b.rate * state.buildings[b.id] * state.mult[b.id] * kMult * traitMod * addMult * plasmaDouble;
  });
  return { production: out, kMult, trait };
}

function engramsHTML() {
  const engrams = meta.engrams || [];
  const k = state.knowledge;
  if (engrams.length === 0) {
    return `<div class="empty" style="padding:40px 0;">
      // no engrams collected<br>
      <span style="font-size:10px;color:var(--text-dim);margin-top:8px;display:block;">complete a jump to receive encrypted data fragments</span>
    </div>`;
  }
  const encrypted = engrams.filter(e => e.encrypted);
  const decrypted = engrams.filter(e => !e.encrypted);

  const renderEngram = (e) => {
    const rd = ENGRAM_RARITIES.find(r => r.id === e.rarity);
    const tpl = ENGRAM_POOL.find(t => t.id === e.templateId);
    const c = rd ? rd.color : 'var(--text-dim)';
    const dmult = (typeof webDecryptCostMult === 'function') ? webDecryptCostMult() : 1.0;
    const effCost = rd ? Math.ceil(rd.kCost * dmult) : 0;
    const canDecrypt = e.encrypted && rd && k >= effCost;
    return `
      <div class="engram ${e.encrypted ? '' : 'decrypted'}" style="--eg-c:${c};border-left-color:${c};">
        <div>
          <div class="engram-rarity">${rd ? rd.name : '???'}</div>
          <div class="engram-name">${e.encrypted ? '[ ENCRYPTED ]' : e.name}</div>
          ${!e.encrypted && tpl ? `<div class="engram-flavor">"${tpl.flavor}"</div>` : ''}
          ${!e.encrypted && tpl && tpl.reward.type === 'pp' ? `<div class="engram-claimed">+${tpl.reward.val} VS claimed</div>` : ''}
        </div>
        <div class="engram-meta">JUMP ${e.jump}<br><span style="font-size:9px;">${e.sectorId || ''}</span></div>
        ${e.encrypted
          ? `<button class="decrypt-btn" style="--eg-c:${c};border-color:${c};color:${c};"
               ${canDecrypt ? '' : 'disabled'} onclick="decryptEngram('${e.uid}')">
               DECRYPT<br><span style="font-size:9px;">${rd ? effCost : '?'} K</span>
             </button>`
          : `<div class="engram-done-mark" style="color:${c};">◆</div>`
        }
      </div>`;
  };

  return `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="engram-summary">
        <div><span>TOTAL</span><strong>${engrams.length}</strong></div>
        <div><span>ENCRYPTED</span><strong style="color:var(--gold);">${encrypted.length}</strong></div>
        <div><span>DECRYPTED</span><strong style="color:var(--cyan);">${decrypted.length}</strong></div>
      </div>
      <p style="font-size:11px;color:var(--text-dim);margin:0;line-height:1.6;">
        Engrams are recovered on every Jump. Decrypt them by spending <strong style="color:var(--cyan);">Knowledge</strong> —
        reducing your multiplier temporarily in exchange for Void Shards and lore.
        Current Knowledge: <strong style="color:var(--cyan);">${k}</strong>
      </p>
      ${encrypted.length > 0 ? `
        <div>
          <div class="obj-cat-title" style="margin-bottom:8px;">// ENCRYPTED (${encrypted.length})</div>
          <div class="engram-list">${encrypted.map(renderEngram).join('')}</div>
        </div>` : ''}
      ${decrypted.length > 0 ? `
        <div>
          <div class="obj-cat-title" style="margin-bottom:8px;">// DECRYPTED (${decrypted.length})</div>
          <div class="engram-list">${decrypted.map(renderEngram).join('')}</div>
        </div>` : ''}
    </div>`;
}

function coreTreeHTML() {
  const SIZE = 560;
  const CENTER = SIZE / 2;
  // Draw lines between adjacent rings (each node connects to all prev-ring nodes that are owned)
  let lines = '';
  for (const node of CORE_TREE) {
    if (node.ring === 1) continue;
    const g = TREE_GEOMETRY[node.id];
    if (!g) continue;
    const prevRing = CORE_TREE.filter(n => n.ring === node.ring - 1);
    for (const prev of prevRing) {
      const pg = TREE_GEOMETRY[prev.id];
      if (!pg) continue;
      const active = meta.coreOwned[prev.id] && (meta.coreOwned[node.id] || isNodeUnlockable(node, meta));
      const stroke = meta.coreOwned[prev.id] && meta.coreOwned[node.id] ? 'var(--cyan)' :
                     active ? 'var(--cyan-dim)' : 'rgba(94,226,255,0.06)';
      lines += `<line x1="${CENTER + pg.x}" y1="${CENTER + pg.y}" x2="${CENTER + g.x}" y2="${CENTER + g.y}" stroke="${stroke}" stroke-width="1" />`;
    }
  }
  // Draw orbital rings (visual guides)
  let orbits = '';
  for (let r = 1; r <= 3; r++) {
    const rad = { 1: 75, 2: 145, 3: 215 }[r];
    orbits += `<circle cx="${CENTER}" cy="${CENTER}" r="${rad}" fill="none" stroke="rgba(94,226,255,0.08)" stroke-width="1" stroke-dasharray="2,4" />`;
  }
  // Center sigil
  const centerSigil = `
    <circle cx="${CENTER}" cy="${CENTER}" r="22" fill="rgba(94,226,255,0.08)" stroke="var(--cyan)" stroke-width="1"/>
    <text x="${CENTER}" y="${CENTER + 8}" text-anchor="middle" font-size="22" fill="var(--cyan)" style="text-shadow: 0 0 8px var(--cyan);">◈</text>
  `;
  // Nodes
  let nodes = '';
  for (const node of CORE_TREE) {
    const g = TREE_GEOMETRY[node.id];
    if (!g) continue;
    const owned = meta.coreOwned[node.id];
    const unlockable = isNodeUnlockable(node, meta);
    const canAfford = meta.pp >= node.cost;
    let cls = 'tree-node';
    if (owned) cls += ' owned';
    else if (unlockable && canAfford) cls += ' afford';
    else if (unlockable) cls += ' available';
    else cls += ' locked';
    nodes += `
      <g class="${cls}" onclick="${owned || !unlockable ? '' : `buyCoreNode('${node.id}')`}" style="cursor: ${owned || !unlockable ? 'default' : 'pointer'}">
        <circle cx="${CENTER + g.x}" cy="${CENTER + g.y}" r="16" />
        <text x="${CENTER + g.x}" y="${CENTER + g.y + 4}" text-anchor="middle" font-size="11">${node.cost}</text>
        <title>${node.name}: ${node.desc} (${node.cost} PP)</title>
      </g>
    `;
  }
  // Legend / info area
  const ringLabels = { 1: 'ORIGIN', 2: 'ACQUISITION', 3: 'REFLEX' };
  return `
    <div class="tree-wrap">
      <div class="tree-svg-wrap">
        <svg viewBox="0 0 ${SIZE} ${SIZE}" width="100%" style="max-width:560px;display:block;margin:0 auto;">
          ${orbits}
          ${lines}
          ${centerSigil}
          ${nodes}
        </svg>
      </div>
      <div class="tree-info">
        <div class="tree-info-title">// CORE PROTOCOLS</div>
        <p class="tree-info-text">
          Written to your core. Survives every Jump. Hover or tap any node to see what it does.
        </p>
        <div class="ring-legend">
          ${[1,2,3].map(r => {
            const ringNodes = CORE_TREE.filter(n => n.ring === r);
            const ownedCount = ringNodes.filter(n => meta.coreOwned[n.id]).length;
            const unlocked = r === 1 || ringNodes.some(n => isNodeUnlockable(n, meta));
            return `<div class="ring-row ${unlocked ? '' : 'locked'}">
              <span class="ring-name">R${r} · ${ringLabels[r] || '???'}</span>
              <span class="ring-progress">${ownedCount}/${ringNodes.length}</span>
            </div>`;
          }).join('')}
          <div class="ring-row locked"><span class="ring-name">R4-R6</span><span class="ring-progress">— v2.x</span></div>
        </div>
        <div class="tree-node-detail" id="tree-node-detail">
          <em>Tap a node to view details.</em>
        </div>
      </div>
    </div>
  `;
}

                return `<div class="obj ${done?'done':''}" ${!done ? `style="cursor:pointer;" onclick="pinObjective('milestone','${m.id}')"` : ''} title="${done ? '' : 'click to pin'}">

      }).join('')}

function patchGridHTML() {
  const pp = state.patchPoints || 0;
  const rows = ['A', 'B', 'C'];
  const rowTitles = { A: 'BURST', B: 'COMPOUND', C: 'SPECIALTY' };
  const rowDesc = {
    A: 'Front-loaded effects. Help the opening of a run.',
    B: 'Compounding effects. Reward longer runs.',
    C: 'Build-defining tradeoffs. Pick one to specialize.',
  };
  // Challenge progress block
  const challenges = (state.challenges || []).map(cid => {
    const tpl = CHALLENGE_TEMPLATES.find(c => c.id === cid);
    if (!tpl) return '';
    const prog = state.challengeProgress[cid] || { progress: 0, done: false };
    const pct = Math.min(100, (prog.progress / tpl.target) * 100);
    return `
      <div class="obj ${prog.done?'done':''}">
        <div class="obj-marker">${prog.done ? '◆' : '◇'}</div>
        <div class="obj-text">
          <div class="obj-name">${tpl.name}</div>
          <div class="obj-desc">${tpl.desc}</div>
          <div style="margin-top:4px;height:3px;background:rgba(94,226,255,0.08);position:relative;">
            <div style="width:${pct}%;height:100%;background:var(--amber);transition:width 0.3s;"></div>
          </div>
        </div>
        <div class="obj-pp" style="color:var(--amber);">+${tpl.pp} PaP</div>
      </div>
    `;
  }).join('');

  const grid = rows.map(r => {
    const nodes = PATCH_GRID.filter(n => n.row === r);
    const cards = nodes.map(n => {
      const owned = !!state.patchOwned[n.id];
      const afford = !owned && pp >= n.cost;
      const cls = owned ? 'owned' : (afford ? 'afford' : 'locked');
      return `
        <button class="node ${cls}" ${owned || !afford ? 'disabled' : ''} onclick="buyPatchNode('${n.id}')">
          <div class="node-tier">${n.cost} PaP</div>
          <div class="node-name">${n.name}</div>
          <div class="node-effect">${n.desc}</div>
          ${owned ? '<div class="node-status">◆ LOADED</div>' : ''}
        </button>
      `;
    }).join('');
    return `
      <div class="branch">
        <div class="branch-title" style="color:var(--amber);">// ROW ${r} — ${rowTitles[r]}</div>
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">${rowDesc[r]}</div>
        <div class="branch-nodes">${cards}</div>
      </div>
    `;
  }).join('');

  return `
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div class="obj-summary">
        <div><span>UNSPENT PATCH POINTS</span><strong style="color:var(--amber);">${pp}</strong></div>
        <div><span>LOADED PATCHES</span><strong>${Object.keys(state.patchOwned||{}).length} / 12</strong></div>
      </div>
      <div>
        <div class="obj-cat-title" style="margin-bottom:10px;">// THIS RUN'S CHALLENGES</div>
        <div class="obj-list">${challenges || '<div class="empty">// no challenges this run</div>'}</div>
      </div>
      <div class="branches">${grid}</div>
      <p style="color:var(--text-dim);font-size:11px;line-height:1.6;margin:0;">
        Patches are loaded as runtime modifications. <strong>All patches and Patch Points are purged on Jump.</strong>
        Complete challenges to earn more Patch Points (PaP) during this run.
      </p>
    </div>
  `;
}

function buildTabHTML() {
  const { kMult, trait } = getProduction();
  const visible = BUILDINGS.filter(b => b.unlock(state));
  if (visible.length === 0) return '<div class="empty">// no constructs available</div>';
  const qtyLabels = [[1,'×1'], [10,'×10'], [100,'×100'], [0,'MAX']];
  const qtyBar = `
    <div class="buy-qty-bar">
      <span>BUY</span>
      ${qtyLabels.map(([v, lbl]) =>
        `<button class="qty-btn ${buyQty === v ? 'active' : ''}" onclick="setBuyQty(${v})">${lbl}</button>`
      ).join('')}
    </div>
  `;
  const cards = visible.map(b => {
    const owned = state.buildings[b.id];
    const qty = buyQty === 0 ? Math.max(1, maxAffordable(b, owned, state.resources)) : buyQty;
    const cost = buildingCostBulk(b, owned, qty);
    const afford = canAffordBuildingN(b, owned, state.resources, qty);
    const traitMod = trait.mods[b.produces] || 1;
    const effRate = b.rate * state.mult[b.id] * kMult * traitMod;
    const costStr = Object.entries(cost).map(([res, amt]) =>
      `<span class="cost-token" data-res="${res}" style="color:${(state.resources[res]||0) >= amt ? 'var(--text)' : 'var(--danger)'}">${fmt(amt)} ${RESOURCE_META[res].sym}</span>`
    ).join('  ');
    const qtyLabel = buyQty === 0 ? `×${qty}` : (qty > 1 ? `×${qty}` : `×${owned}`);
    return `
      <button class="card ${afford?'afford':''}" data-id="${b.id}" ${afford?'':'disabled'}
        onclick="buyBuilding('${b.id}')"
        style="--c: ${RESOURCE_META[b.produces].color}">
        <div class="card-row">
          <div class="card-name">${b.name}</div>
          <div class="card-owned">${buyQty === 1 ? `×${owned}` : `×${owned} <span style="color:var(--cyan-dim)">+${qty}</span>`}</div>
        </div>
        <div class="card-desc">${b.desc}</div>
        <div class="card-row card-foot">
          <div class="card-cost">COST: ${costStr}</div>
          <div class="card-rate">+${effRate.toFixed(2)} ${RESOURCE_META[b.produces].sym}/s</div>
        </div>
      </button>
    `;
  }).join('');
  return qtyBar + `<div class="grid-list">` + cards + `</div>`;
}

function renderCrewCard(c) {
  const cls = CREW_CLASSES[c.class];
  const color = cls ? cls.color : 'var(--text-dim)';
  const isInjured = c.alive && c.injured;
  const statusColor = !c.alive ? 'var(--danger)' : isInjured ? 'var(--amber)' : 'var(--cyan)';
  const statusText = !c.alive ? '✕ KIA' : isInjured ? '⚠ INJURED' : '● ACTIVE';
  const lvl = (typeof crewLevel === 'function') ? crewLevel(c) : 1;
  const title = (typeof crewTitle === 'function') ? crewTitle(c) : '';
  const xp = (typeof crewXP === 'function') ? crewXP(c) : 0;
  const nextXp = (typeof crewXPNeededForNext === 'function') ? crewXPNeededForNext(c) : null;
  const prevXp = lvl > 1 && CREW_LEVEL_XP ? (CREW_LEVEL_XP[lvl] || 0) : 0;
  const intoLvl = xp - prevXp;
  const lvlSpan = (nextXp != null) ? (nextXp - prevXp) : 1;
  const xpPct = Math.max(0, Math.min(100, (intoLvl / lvlSpan) * 100));
  return `
    <div class="crewmate ${!c.alive ? 'dead' : ''} ${isInjured ? 'injured' : ''}"
         style="--cr-c:${color};">
      <div class="crew-sym">${cls ? cls.sym : '?'}</div>
      <div>
        <div class="crew-name"><span class="crew-level-pill" style="--cr-c:${color};">L${lvl}</span>${c.name}</div>
        <div class="crew-class">${cls ? cls.name.toUpperCase() : 'UNKNOWN'}</div>
        ${title ? `<div class="crew-title">${title.toUpperCase()}</div>` : ''}
        <div class="crew-desc">${cls ? cls.desc : ''}</div>
        ${c.alive && nextXp != null ? `
          <div class="crew-xp-bar"><div class="crew-xp-fill" style="--cr-c:${color};width:${xpPct}%;"></div></div>
          <div class="crew-xp-label">${intoLvl} / ${lvlSpan} XP</div>
        ` : (c.alive ? `<div class="crew-xp-label" style="color:var(--gold);">MAX LEVEL</div>` : '')}
      </div>
      <div>
        <div class="crew-status" style="color:${statusColor};">${statusText}</div>
        <div class="crew-joined">JUMP ${c.joinedJump}</div>
        ${isInjured && c.injuredUntil != null ? `<div class="crew-joined" style="color:var(--amber);">recovers J${c.injuredUntil}</div>` : ''}
      </div>
    </div>`;
}

// --- TICK ---------------------------------------------------
let lastTick = Date.now();
let lastSaveTime = Date.now();

function tick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  // Wave 19: skip the tick body entirely while paused (still keeps the interval running)
  if (typeof isPaused === 'function' && isPaused()) {
    if (now - lastSaveTime > 5000) {
      save(); saveMeta(); lastSaveTime = now;
    }
    return;
  }
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  // Wave 8: exotic boost from Singularity Sighting anomaly
  let exoticMult = 1;
  if (state._exoticBoost && state._exoticBoost.until > now) {
    exoticMult = state._exoticBoost.mult || 1;
  } else if (state._exoticBoost) {
    state._exoticBoost = null;
  }
  BUILDINGS.forEach(b => {
    const count = state.buildings[b.id];
    if (count > 0) {
      const traitMod = trait.mods[b.produces] || 1;
      const addMult = additiveProductionMult(b.produces);  // Wave 4c: combined meta+patch
      const plasmaDouble = patchPlasmaDoubler(b.produces);
      const gain = b.rate * count * state.mult[b.id] * kMult * traitMod * addMult * plasmaDouble * exoticMult * dt;
      state.resources[b.produces] += gain;
    }
  });
  // Pulse Cascade (Wave 4b nerfed): passive trickle — 0.1s of total production every 30s
  if (metaHas('r3_cascade')) {
    state.cascadeAccum = (state.cascadeAccum || 0) + dt;
    while (state.cascadeAccum >= 30) {
      state.cascadeAccum -= 30;
      BUILDINGS.forEach(b => {
        const count = state.buildings[b.id];
        if (count > 0) {
          const tmod = trait.mods[b.produces] || 1;
          const addMult = additiveProductionMult(b.produces);
          const plasmaDouble = patchPlasmaDoubler(b.produces);
          state.resources[b.produces] += b.rate * count * state.mult[b.id] * kMult * tmod * addMult * plasmaDouble * 0.1;
        }
      });
    }
  }
  // Trigger Memory: auto-pulse 1/s when window is blurred
  if (windowBlurred && metaHas('r3_trigger')) {
    autoPulseAccum += dt;
    while (autoPulseAccum >= 1) {
      autoPulseAccum -= 1;
      doPulseLogic(false);
    }
  }
  // Check milestones (cheap — early exit on each one)
  const newMs = checkMilestones();
  if (newMs.length) {
    for (const m of newMs) {
      pushLog(`> milestone: ${m.name} // +${m.pp} VS`);
    }
    if (newMs.length === 1) flash(`◆ MILESTONE // ${newMs[0].name}`);
    else flash(`◆ ${newMs.length} MILESTONES achieved`);
  }
  // Wave 11: check achievements
  if (typeof checkAchievements === 'function') {
    const newAch = checkAchievements();
    for (const a of newAch) {
      pushLog(`> achievement: ${a.name} // +${a.vs} VS`);
      flash(`✦ ACHIEVEMENT // ${a.name} (+${a.vs} VS)`);
    }
  }
  // Wave 4b: check per-run challenges
  const newCh = checkChallenges();
  if (newCh.length) {
    for (const c of newCh) pushLog(`> challenge complete: ${c.name} // +${c.pp} Patch Points`);
    flash(`◇ CHALLENGE // ${newCh[0].name}`);
  }
  renderResources();
  refreshAffordability();
  maybeAmbientLog(now);
  if (typeof maybeAnomaly === 'function') maybeAnomaly(now);
  // Wave 10: passive crew XP — 1 XP every 6 seconds for each alive uninjured crew
  if (typeof awardCrewXP === 'function' && meta.crew && meta.crew.length > 0) {
    crewXpAccum = (crewXpAccum || 0) + dt;
    while (crewXpAccum >= 6) {
      crewXpAccum -= 6;
      awardCrewXP(1);
    }
  }
  // Wave 12 (auto-decrypt only — auto-buy removed in Wave 15)
  autoDecryptAccum = (autoDecryptAccum || 0) + dt;
  if (autoDecryptAccum >= 2) {
    autoDecryptAccum = 0;
    if (typeof runAutoDecrypt === 'function') runAutoDecrypt();
  }
  // periodic save every 5s
  if (now - lastSaveTime > 5000) {
    save();
    saveMeta();
    lastSaveTime = now;
    renderHeader();
  }
}
let crewXpAccum = 0;
let autoDecryptAccum = 0;

let windowBlurred = false;
let autoPulseAccum = 0;
window.addEventListener('blur', () => { windowBlurred = true; });
window.addEventListener('focus', () => { windowBlurred = false; });

// Lightweight: update only afford-state classes & disabled attribute on cards/nodes.
// Does NOT re-render the whole panel — preserves scroll, prevents flicker.
function refreshAffordability() {
  // Building cards
  document.querySelectorAll('.card[data-id]').forEach(el => {
    const id = el.getAttribute('data-id');
    const b = BUILDINGS.find(x => x.id === id);
    if (!b) return;
    const owned = state.buildings[b.id];
    const qty = buyQty === 0 ? Math.max(1, maxAffordable(b, owned, state.resources)) : buyQty;
    const afford = canAffordBuildingN(b, owned, state.resources, qty);
    el.classList.toggle('afford', afford);
    if (afford) el.removeAttribute('disabled'); else el.setAttribute('disabled', '');
    const cost = buildingCostBulk(b, owned, qty);
    const tokens = el.querySelectorAll('.cost-token[data-res]');
    tokens.forEach(t => {
      const res = t.getAttribute('data-res');
      const amt = cost[res] || 0;
      t.style.color = (state.resources[res] || 0) >= amt ? 'var(--text)' : 'var(--danger)';
    });
  });
  // Research nodes
  document.querySelectorAll('.node[data-id]').forEach(el => {
    const id = el.getAttribute('data-id');
    const u = UPGRADES.find(x => x.id === id);
    if (!u) return;
    if (state.upgrades[u.id]) return; // owned, nothing to update
    const reqsMet = u.req.every(r => state.upgrades[r]);
    if (!reqsMet) return;
    const afford = Object.entries(u.cost).every(([res, amt]) => state.resources[res] >= amt);
    el.classList.toggle('afford', afford);
    if (afford) el.removeAttribute('disabled'); else el.setAttribute('disabled', '');
  });
  // Jump button affordability handled by full tab re-render rarely; do it cheaply here too
  const jumpBtn = document.querySelector('.jump-btn');
  if (jumpBtn) {
    const kGain = computeKnowledgeGain();
    if (kGain >= 1) {
      jumpBtn.removeAttribute('disabled');
      jumpBtn.textContent = `✦ INITIATE JUMP (+${kGain})`;
    } else {
      jumpBtn.setAttribute('disabled', '');
      jumpBtn.textContent = '✦ INSUFFICIENT MASS';
    }
  }
}

// --- INIT ---------------------------------------------------
window.addEventListener('beforeunload', () => save());
window.addEventListener('blur', () => save());

function init() {
  meta = loadMeta();
  state = load();
  if (!state) {
    state = freshRun(0, 0);
  } else {
    const offline = applyOfflineProgress(state);
    if (offline) {
      // schedule modal after render
      setTimeout(() => {
        const lines = RESOURCE_LIST
          .filter(r => offline.gains[r] > 0)
          .map(r => `<div class="modal-gains-line">
            <span>${RESOURCE_META[r].sym} ${RESOURCE_META[r].label}</span>
            <span>+${fmt(offline.gains[r])}</span>
          </div>`).join('');
        const mins = Math.floor(offline.elapsed / 60);
        const secs = Math.floor(offline.elapsed % 60);
        const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        const cap = metaOfflineCap() / 3600;
        showModal(
          '◈ WELCOME BACK',
          `<p>System was idle for <strong>${timeStr}</strong>. Auto-collectors continued operations:</p>
           <div class="modal-gains">${lines}</div>
           <p style="color:var(--text-dim);font-size:11px;">Offline collection capped at ${cap}h.</p>`,
          'RESUME OPERATIONS'
        );
      }, 100);
    }
  }
  // Record current sector trait as visited (for the sector milestones)
  if (state && state.sector) {
    if (!meta.traitsVisited[state.sector.traitId]) {
      meta.traitsVisited[state.sector.traitId] = true;
      saveMeta();
    }
    // Wave 8: record starting sector in codex (idempotent — only adds once)
    if (typeof ensureCodex === 'function') {
      ensureCodex();
      if (!meta.codex.sectorsLogged[state.sector.id]) {
        recordSectorVisit(state.sector);
        saveMeta();
      }
    }
  }
  // Wave 8: ensure hull defaults to 100 if missing
  if (state && typeof state.hull !== 'number') state.hull = 100;
  // Wave 13: apply saved theme
  if (typeof applyTheme === 'function') applyTheme();
  // Run milestone check on load (handles save-format upgrades adding new milestones)
  checkMilestones();
  renderAll();
  setInterval(tick, 100);
  // Generate ship seed on first load
  if (!meta.shipSeed) {
    meta.shipSeed = ((Date.now() * 7 + Math.floor(Math.random() * 10000)) % 99997) + 1;
    saveMeta();
  }
  // Starfield
  if (state && state.sector) updateStarfieldTrait(state.sector.traitId);
  initStarfield();
}

init();
</script>
