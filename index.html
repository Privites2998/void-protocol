<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg2: #0a1220;
    --panel: rgba(10, 18, 32, 0.7);
    --border: rgba(100, 220, 255, 0.15);
    --border-bright: rgba(100, 220, 255, 0.45);
    --cyan: #5ee2ff;
    --cyan-dim: #2a8aa8;
    --amber: #ffb347;
    --steel: #a8b8cc;
    --magenta: #ff4fa3;
    --gold: #ffe88a;
    --text: #c8d4e0;
    --text-dim: #6a7a8c;
    --danger: #ff5577;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: radial-gradient(ellipse at 20% 0%, #0d1830 0%, var(--bg) 50%),
                radial-gradient(ellipse at 80% 100%, #1a0a2e 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .app { padding: 24px; position: relative; z-index: 3; }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(
      0deg, transparent 0px, transparent 2px,
      rgba(94, 226, 255, 0.025) 2px, rgba(94, 226, 255, 0.025) 3px
    );
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* HEADER */
  .hdr {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 16px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Syncopate', 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 24px;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(94, 226, 255, 0.4);
    letter-spacing: 0.18em;
  }
  .sub { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
  .sub .sector-id { color: var(--cyan-dim); }
  .sub .sector-trait { color: var(--amber); margin-left: 8px; }
  .hdr-right { display: flex; gap: 12px; align-items: center; }
  .knowledge {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 16px;
    background: linear-gradient(135deg, rgba(255, 79, 163, 0.1), rgba(255, 79, 163, 0.02));
    border: 1px solid rgba(255, 79, 163, 0.3);
  }
  .knowledge span { color: var(--magenta); font-size: 10px; letter-spacing: 0.15em; }
  .knowledge strong { color: #fff; font-size: 18px; font-weight: 500; }
  .knowledge em { color: var(--text-dim); font-style: normal; font-size: 11px; }
  .save-status {
    color: var(--text-dim); font-size: 10px; letter-spacing: 0.15em;
    display: flex; align-items: center; gap: 6px;
  }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan-dim); }
  .save-dot.active { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* RESOURCES */
  .res-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .res {
    background: var(--panel); border: 1px solid var(--border);
    border-left: 2px solid var(--c); padding: 12px 16px;
    backdrop-filter: blur(4px); transition: border-color 0.2s;
  }
  .res:hover { border-color: var(--c); }
  .res-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--c); font-size: 10px; letter-spacing: 0.2em; margin-bottom: 4px;
  }
  .res-sym { font-size: 14px; }
  .res-val {
    font-size: 22px; font-weight: 500; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .res-rate { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* MAIN */
  .main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    backdrop-filter: blur(4px); padding: 16px;
  }
  .panel-title {
    color: var(--cyan-dim); font-size: 10px;
    letter-spacing: 0.2em; margin-bottom: 12px;
  }

  /* REACTOR */
  .reactor-col { display: flex; flex-direction: column; gap: 16px; }
  .reactor-panel { display: flex; flex-direction: column; align-items: center; }
  .reactor {
    width: 220px; height: 220px; position: relative;
    background: radial-gradient(circle, rgba(94, 226, 255, 0.15) 0%, transparent 70%);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 8px 0;
  }
  .reactor-ring {
    position: absolute; inset: 0; border: 1px solid var(--cyan-dim);
    border-radius: 50%; animation: spin 12s linear infinite;
  }
  .reactor-ring.r2 {
    inset: 14px; border-color: rgba(94, 226, 255, 0.4);
    border-top-color: var(--cyan); border-right-color: transparent;
    animation: spin 6s linear infinite reverse;
  }
  .reactor-core {
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, #1a3a4d 0%, #050810 80%);
    border: 1px solid var(--cyan);
    box-shadow: 0 0 30px rgba(94, 226, 255, 0.4),
                inset 0 0 30px rgba(94, 226, 255, 0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .reactor:hover .reactor-core {
    box-shadow: 0 0 50px rgba(94, 226, 255, 0.7),
                inset 0 0 40px rgba(94, 226, 255, 0.3);
  }
  .reactor.pulse .reactor-core {
    transform: scale(0.92);
    box-shadow: 0 0 80px rgba(94, 226, 255, 1),
                inset 0 0 50px rgba(94, 226, 255, 0.5);
  }
  .reactor-sym {
    font-size: 42px; color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
  }
  .reactor-amt {
    font-size: 14px; color: var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  .reactor-hint {
    color: var(--text-dim); font-size: 10px;
    letter-spacing: 0.2em; margin-top: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* LOG */
  .log { display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
  .log-line {
    color: var(--cyan-dim); font-size: 11px;
    animation: fadein 0.4s;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateX(-4px); }
    to { opacity: 1; transform: none; }
  }

  /* TABS */
  .right-col { display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab {
    background: transparent; border: 1px solid var(--border); border-bottom: none;
    color: var(--text-dim); padding: 10px 18px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.15em;
    cursor: pointer; position: relative; transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--panel); color: var(--cyan);
    border-color: var(--border-bright);
    border-bottom: 1px solid var(--panel); margin-bottom: -1px;
  }
  .tab.jump-tab { color: var(--magenta); border-color: rgba(255, 79, 163, 0.3); }
  .tab.jump-tab.active { color: var(--magenta); border-color: rgba(255, 79, 163, 0.6); }
  .badge {
    display: inline-block; background: var(--amber); color: #000;
    padding: 1px 6px; font-size: 9px; margin-left: 8px; font-weight: 700;
  }
  .tab-panel { min-height: 400px; border-top: none; }

  /* CARDS */
  .grid-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .card {
    background: rgba(5, 8, 16, 0.5); border: 1px solid var(--border);
    border-left: 2px solid var(--c); padding: 12px;
    text-align: left; cursor: pointer; color: var(--text);
    font-family: inherit; transition: all 0.15s;
  }
  .card:disabled { cursor: not-allowed; opacity: 0.55; }
  .card.afford:hover {
    background: rgba(94, 226, 255, 0.05); border-color: var(--c);
    transform: translateX(2px);
  }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-name { color: var(--c); font-size: 13px; font-weight: 500; }
  .card-owned { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .card-desc { font-size: 11px; color: var(--text-dim); margin: 6px 0; }
  .card-foot {
    font-size: 10px; margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .card-cost { color: var(--text); }
  .card-rate { color: var(--cyan-dim); }
  .empty { color: var(--text-dim); font-size: 12px; padding: 24px; text-align: center; }

  /* RESEARCH */
  .branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .branches { grid-template-columns: 1fr; } }
  .branch { display: flex; flex-direction: column; gap: 8px; }
  .branch-title {
    color: var(--amber); font-size: 10px; letter-spacing: 0.2em;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .branch-nodes { display: flex; flex-direction: column; gap: 8px; }
  .node {
    background: rgba(5, 8, 16, 0.5); border: 1px solid var(--border);
    padding: 10px; text-align: left; cursor: pointer; color: var(--text);
    font-family: inherit; transition: all 0.15s; position: relative;
  }
  .node:disabled { cursor: not-allowed; }
  .node.locked { opacity: 0.3; cursor: not-allowed; }
  .node.afford { border-color: var(--amber); box-shadow: 0 0 12px rgba(255, 179, 71, 0.2); }
  .node.afford:hover { background: rgba(255, 179, 71, 0.05); }
  .node.owned { border-color: var(--cyan); background: rgba(94, 226, 255, 0.04); cursor: default; }
  .node-tier {
    position: absolute; top: 8px; right: 10px;
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.15em;
  }
  .node-name { font-size: 12px; color: var(--cyan); margin-bottom: 4px; }
  .node-effect { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
  .node-cost {
    font-size: 10px; color: var(--amber);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .node-status { font-size: 10px; color: var(--cyan); letter-spacing: 0.15em; }

  /* JUMP */
  .jump-pane { padding: 12px; }
  .jump-title { color: var(--magenta); font-size: 14px; letter-spacing: 0.2em; margin-bottom: 16px; }
  .jump-text { font-size: 12px; line-height: 1.7; color: var(--text); margin-bottom: 20px; }
  .jump-text strong { color: var(--magenta); }
  .jump-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 20px; padding: 16px;
    background: rgba(255, 79, 163, 0.04);
    border: 1px solid rgba(255, 79, 163, 0.2);
  }
  .jump-stats > div { display: flex; flex-direction: column; gap: 4px; }
  .jump-stats span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.15em; }
  .jump-stats strong { color: #fff; font-size: 20px; font-weight: 500; }
  .jump-stats .gain { color: var(--magenta); }
  .jump-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--magenta), #c8307f);
    border: none; color: #fff; padding: 14px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.2em;
    cursor: pointer; transition: all 0.2s;
  }
  .jump-btn:disabled {
    background: rgba(255, 79, 163, 0.1); color: var(--text-dim); cursor: not-allowed;
  }
  .jump-btn:not(:disabled):hover {
    box-shadow: 0 0 30px rgba(255, 79, 163, 0.5); transform: translateY(-1px);
  }
  .jump-hint { color: var(--text-dim); font-size: 10px; margin-top: 8px; text-align: center; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--bg2); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 12px 24px; font-size: 12px; letter-spacing: 0.15em;
    z-index: 100; box-shadow: 0 0 30px rgba(94, 226, 255, 0.4);
    animation: toast-in 0.3s;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    animation: fadein 0.3s;
  }
  .modal {
    background: var(--bg2); border: 1px solid var(--cyan);
    box-shadow: 0 0 60px rgba(94, 226, 255, 0.4);
    padding: 32px; max-width: 480px; width: calc(100% - 32px);
  }
  .modal-title {
    font-family: 'Syncopate', 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--cyan); font-size: 16px;
    letter-spacing: 0.18em; margin-bottom: 16px;
  }
  .modal-body {
    font-size: 12px; line-height: 1.7; color: var(--text);
    margin-bottom: 20px;
  }
  .modal-gains { background: rgba(94, 226, 255, 0.05); padding: 12px; margin: 12px 0; }
  .modal-gains-line {
    display: flex; justify-content: space-between; padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .modal-btn {
    width: 100%; background: var(--cyan); color: var(--bg);
    border: none; padding: 12px; font-family: inherit; font-size: 12px;
    letter-spacing: 0.2em; cursor: pointer; font-weight: 500;
  }
  .modal-btn:hover { background: #fff; }

  /* RESET */
  .reset-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 6px 12px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.15em;
    cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* PROTOCOLS — SUB-TABS */
  .sub-tabs {
    display: flex; gap: 0; align-items: center;
    border-bottom: 1px solid var(--border);
    margin: -16px -16px 16px;
    padding: 0 16px;
  }
  .sub-tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dim); padding: 12px 16px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.18em;
    cursor: pointer; transition: all 0.15s;
  }
  .sub-tab:hover { color: var(--text); }
  .sub-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  .sub-tab-meter {
    margin-left: auto; display: flex; align-items: baseline; gap: 8px;
    padding: 8px 12px;
  }
  .meter-label {
    color: var(--text-dim); font-size: 9px; letter-spacing: 0.2em;
  }
  .meter-val {
    color: var(--cyan); font-size: 18px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 8px rgba(94, 226, 255, 0.4);
  }
  .pp-badge { background: var(--cyan); color: var(--bg); }

  /* TREE */
  .tree-wrap {
    display: grid; grid-template-columns: 1fr 280px; gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) { .tree-wrap { grid-template-columns: 1fr; } }
  .tree-svg-wrap {
    background: radial-gradient(circle, rgba(94,226,255,0.04) 0%, transparent 70%);
    border: 1px solid var(--border);
    padding: 16px;
  }
  .tree-info { display: flex; flex-direction: column; gap: 16px; }
  .tree-info-title { color: var(--cyan-dim); font-size: 10px; letter-spacing: 0.2em; }
  .tree-info-text { font-size: 11px; line-height: 1.6; color: var(--text-dim); margin: 0; }
  .ring-legend { display: flex; flex-direction: column; gap: 4px; }
  .ring-row {
    display: flex; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(5,8,16,0.5); border-left: 2px solid var(--cyan-dim);
    font-size: 11px;
  }
  .ring-row.locked { opacity: 0.35; border-left-color: var(--text-dim); }
  .ring-name { color: var(--text); letter-spacing: 0.1em; }
  .ring-progress { color: var(--cyan-dim); font-variant-numeric: tabular-nums; }
  .tree-node-detail {
    background: rgba(5,8,16,0.5);
    border: 1px solid var(--border);
    padding: 12px;
    min-height: 60px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text);
  }
  .tree-node-detail em { color: var(--text-dim); font-style: italic; }
  .tree-node-detail .detail-name { color: var(--cyan); font-size: 12px; margin-bottom: 4px; }
  .tree-node-detail .detail-cost { color: var(--amber); font-size: 10px; margin-top: 6px; }

  /* TREE NODES — SVG */
  .tree-node circle {
    fill: rgba(5,8,16,0.9); stroke: var(--text-dim); stroke-width: 1.5;
    transition: all 0.2s;
  }
  .tree-node text { fill: var(--text-dim); font-family: 'JetBrains Mono', monospace; pointer-events: none; }
  .tree-node.locked circle { fill: rgba(5,8,16,0.5); stroke: rgba(106,122,140,0.3); }
  .tree-node.locked text { fill: rgba(106,122,140,0.4); }
  .tree-node.available circle { fill: rgba(5,8,16,0.9); stroke: var(--cyan-dim); }
  .tree-node.available text { fill: var(--cyan-dim); }
  .tree-node.afford circle {
    fill: rgba(94,226,255,0.1); stroke: var(--cyan); stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(94,226,255,0.5));
  }
  .tree-node.afford text { fill: var(--cyan); }
  .tree-node.afford { animation: tree-pulse 2s ease-in-out infinite; }
  .tree-node.owned circle {
    fill: var(--cyan); stroke: #fff;
    filter: drop-shadow(0 0 8px var(--cyan));
  }
  .tree-node.owned text { fill: var(--bg); font-weight: 700; }
  .tree-node:hover circle:not([disabled]) { stroke-width: 2.5; }
  @keyframes tree-pulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(94,226,255,0.5)); }
    50% { filter: drop-shadow(0 0 12px rgba(94,226,255,0.9)); }
  }

  /* OBJECTIVES */
  .obj-wrap { display: flex; flex-direction: column; gap: 16px; }
  .obj-summary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 16px;
    background: rgba(94,226,255,0.04);
    border: 1px solid var(--border);
  }
  .obj-summary > div { display: flex; flex-direction: column; gap: 4px; }
  .obj-summary span { color: var(--text-dim); font-size: 10px; letter-spacing: 0.18em; }
  .obj-summary strong {
    color: #fff; font-size: 22px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .obj-cat { display: flex; flex-direction: column; gap: 6px; }
  .obj-cat-title {
    color: var(--amber); font-size: 10px; letter-spacing: 0.2em;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .obj-list { display: flex; flex-direction: column; gap: 4px; }
  .obj {
    display: grid; grid-template-columns: 24px 1fr auto; gap: 12px;
    padding: 8px 12px;
    background: rgba(5,8,16,0.5); border: 1px solid var(--border);
    border-left: 2px solid var(--text-dim);
    align-items: center;
    font-size: 11px;
  }
  .obj.done {
    border-left-color: var(--cyan);
    background: rgba(94,226,255,0.03);
  }
  .obj-marker { color: var(--text-dim); font-size: 14px; }
  .obj.done .obj-marker { color: var(--cyan); }
  .obj-name { color: var(--text); }
  .obj.done .obj-name { color: var(--cyan); }
  .obj-desc { color: var(--text-dim); font-size: 10px; margin-top: 2px; }
  .obj-pp {
    color: var(--amber); font-size: 10px;
    letter-spacing: 0.15em; font-variant-numeric: tabular-nums;
  }
  .obj.done .obj-pp { color: var(--cyan-dim); }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="app" id="app"></div>

<script>
'use strict';

// ============================================================
// VOID PROTOCOL v2 — Wave 1 (foundation, save, sectors)
// ============================================================

const SAVE_VERSION = 5;
const SAVE_KEY = 'voidProtocol';
const META_KEY = 'voidProtocolMeta';
const MAX_OFFLINE_SECONDS = 4 * 60 * 60; // 4h default (Hoarder extends to 6h)

// --- FORMATTING ---------------------------------------------
const fmt = (n) => {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n.toFixed(n < 10 ? 1 : 0);
  if (n < 1e6) return (n / 1e3).toFixed(2) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  if (n < 1e12) return (n / 1e9).toFixed(2) + 'B';
  if (n < 1e15) return (n / 1e12).toFixed(2) + 'T';
  return n.toExponential(2);
};

// --- RESOURCES ----------------------------------------------

// Geometry — used by spiral renderer. Computed once.
const TREE_GEOMETRY = (() => {
  const ringRadii = { 1: 75, 2: 145, 3: 215, 4: 285, 5: 355, 6: 425 };
  const out = {};
  // Wave 4c: opened Ring 4 for the lone 'r4_aetheric' protocol.
  // Rings 4-6 will be filled in Wave 4e with the full Core Tree expansion.
  for (let ring = 1; ring <= 4; ring++) {
    const nodes = CORE_TREE.filter(n => n.ring === ring);
    const count = nodes.length;
    if (count === 0) continue;
    // start angle offset alternating per ring for variety
    const offset = (ring % 2 === 0) ? Math.PI / count : 0;
    nodes.forEach((n, i) => {
      const angle = (i / count) * Math.PI * 2 + offset - Math.PI / 2;
      out[n.id] = {
        x: Math.cos(angle) * ringRadii[ring],
        y: Math.sin(angle) * ringRadii[ring],
        ring,
        radius: ringRadii[ring],
      };
    });
  }
  return out;
})();

// Check whether a node is unlockable: ring 1 always, ring N requires any ring N-1 node owned
function isNodeUnlockable(node, meta) {
  if (node.ring === 1) return true;
  return CORE_TREE.some(n => n.ring === node.ring - 1 && meta.coreOwned[n.id]);
}

function buyPatchNode(id) {
  const node = PATCH_GRID.find(n => n.id === id);
  if (!node || state.patchOwned[id]) return;
  if ((state.patchPoints || 0) < node.cost) return;
  state.patchPoints -= node.cost;
  state.patchOwned[id] = true;
  if (id === 'pa1') state.resources.energy += 25;
  save();
  pushLog(`> patch loaded: ${node.name.toUpperCase()}`);
  flash(`◇ PATCH // ${node.name}`);
  renderAll();
}

function rollChallenges() {
  // Wave 4c: challenge count scales with total Jumps so Patch Points feel earned.
  // 2 challenges pre-jump, 3 after Jump 1, 4 after Jump 3, 5 after Jump 6.
  // (Reads `meta.totalJumps` — meta is guaranteed loaded by the time freshRun calls this.)
  const jumps = (typeof meta !== 'undefined' && meta) ? (meta.totalJumps || 0) : 0;
  let n = 2;
  if (jumps >= 1) n = 3;
  if (jumps >= 3) n = 4;
  if (jumps >= 6) n = 5;
  const pool = [...CHALLENGE_TEMPLATES];
  const out = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool[idx].id);
    pool.splice(idx, 1);
  }
  return out;
}

function checkChallenges() {
  if (!state.challenges || !state.challengeProgress) return [];
  const newly = [];
  for (const cid of state.challenges) {
    if (state.challengeProgress[cid] && state.challengeProgress[cid].done) continue;
    const tpl = CHALLENGE_TEMPLATES.find(c => c.id === cid);
    if (!tpl) continue;
    if (!state.challengeProgress[cid]) state.challengeProgress[cid] = { progress: 0, done: false, pulses: 0 };
    const current = tpl.track(state, state.challengeProgress[cid]);
    state.challengeProgress[cid].progress = Math.min(current, tpl.target);
    if (current >= tpl.target) {
      state.challengeProgress[cid].done = true;
      state.patchPoints = (state.patchPoints || 0) + tpl.pp;
      newly.push(tpl);
    }
  }
  return newly;
}

// --- META STATE (persists across all runs, NEVER reset by Jump or hard reset of run) ---
function freshMeta() {
  return {
    metaVersion: SAVE_VERSION,
    pp: 0,                          // unspent Protocol Points
    coreOwned: {},                  // { nodeId: true }
    milestonesEarned: {},           // { milestoneId: true }
    totalJumps: 0,
    traitsVisited: {},              // { traitId: true }
    lifetimeKnowledgeMax: 0,
  };
}

let meta = null;

function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return freshMeta();
    const parsed = JSON.parse(raw);
    // future-proof migration if metaVersion is older
    if (!parsed.metaVersion) parsed.metaVersion = SAVE_VERSION;
    // ensure all expected keys exist
    const fresh = freshMeta();
    for (const k of Object.keys(fresh)) {
      if (!(k in parsed)) parsed[k] = fresh[k];
    }
    return parsed;
  } catch (e) {
    console.warn('meta load failed', e);
    return freshMeta();
  }
}

function saveMeta() {
  try {
    localStorage.setItem(META_KEY, JSON.stringify(meta));
  } catch (e) {
    console.warn('meta save failed', e);
  }
}

function metaStartingEnergy() {

function metaProductionMult(resource) {

// --- Wave 4c: ADDITIVE STACKING ---
// Previously meta bonuses and patch bonuses all multiplied together, causing
// parabolic late-game scaling. New model: sum the bonuses and apply once.
// Knowledge × trait stay multiplicative as the "true" prestige/sector axis.
function metaProductionBonus(resource) {
  let bonus = 0;
  if (metaHas('r1_memory')) bonus += 0.05;
  if (resource === 'energy' && metaHas('r2_energy')) bonus += 0.20;
  if (resource === 'data'   && metaHas('r2_data'))   bonus += 0.20;
  if (resource === 'alloy'  && metaHas('r2_alloy'))  bonus += 0.20;
  if (resource === 'plasma' && metaHas('r2_plasma')) bonus += 0.20;
  return bonus;
}

function patchProductionBonus(resource) {
  let bonus = 0;
  if (PATCH_HAS('pa4')) {
    const elapsed = (Date.now() - (state.runStartTime || Date.now())) / 1000;
    if (elapsed < 300) bonus += 0.10;
  }
  if (PATCH_HAS('pb1')) {
    const minutes = (Date.now() - (state.runStartTime || Date.now())) / 60000;
    bonus += Math.min(0.25, minutes * 0.01);
  }
  if (PATCH_HAS('pb2')) {
    const totalBuildings = Object.values(state.buildings).reduce((a, b) => a + b, 0);
    bonus += Math.min(0.50, totalBuildings * 0.005);
  }
  if (PATCH_HAS('pc2')) bonus += 0.20;
  if (PATCH_HAS('pc4')) bonus += 1.00;
  return bonus;
}

function additiveProductionMult(resource) {
  return 1 + metaProductionBonus(resource) + patchProductionBonus(resource);
}

// Check all milestones, award PP for newly earned ones, returns array of newly earned for toast/log.
function checkMilestones() {
  const newly = [];

    if (meta.milestonesEarned[m.id]) continue;
    if (m.check(state, meta)) {
      meta.milestonesEarned[m.id] = true;
      meta.pp += m.pp;
      newly.push(m);
    }
  }
  if (newly.length) saveMeta();
  return newly;
}

function buyCoreNode(id) {

  if (!isNodeUnlockable(node, meta)) return;
  if (meta.pp < node.cost) return;

  saveMeta();
  pushLog(`> core protocol compiled: ${node.name.toUpperCase()}`);
  flash(`◆ PROTOCOL // ${node.name}`);
  renderAll();
}

// Wave 4c: COST_GROWTH lowered from 1.15 to 1.08.
// Old curve: building #50 ≈ ×1083 base cost. New curve: building #50 ≈ ×46.9 base cost,
// building #100 ≈ ×2200 base, building #500 unreachable but possible to dream about.
// This makes round-number purchases (100, 250, 500 of a building) feel achievable.
const COST_GROWTH = 1.08;
const buildingCost = (b, owned) => {
  const out = {};
  const metaMult = (typeof meta !== 'undefined' && meta) ? metaBuildingCostMult(b.id) : 1;
  // Wave 4b: Discount Schematic (pa2) — first building built (any kind) costs -50%
  const totalBuilt = (typeof state !== 'undefined' && state && state.buildings)
    ? Object.values(state.buildings).reduce((a, c) => a + c, 0) : 0;
  const patchMult = (typeof state !== 'undefined' && state) ? patchFirstBuildDiscount(totalBuilt) : 1;
  for (const [res, base] of Object.entries(b.costs)) {
    out[res] = Math.ceil(base * Math.pow(COST_GROWTH, owned) * metaMult * patchMult);
  }
  return out;
};
const canAffordBuilding = (b, owned, resources) => {
  const cost = buildingCost(b, owned);
  return Object.entries(cost).every(([res, amt]) => resources[res] >= amt);
};

// Wave 4b: sublinearized from linear (1 + k*base) to sqrt (1 + sqrt(k)*base)
// to prevent permanent Knowledge from trivializing late-campaign runs.
// Causal Engineering (EXO T5) still triples base; effect is now meaningful
// without runaway compounding past ~Knowledge 50.
const KNOWLEDGE_BASE = 0.25;
function knowledgeMult(s) {
  const base = (s && s._causalEng) ? KNOWLEDGE_BASE * 3 : KNOWLEDGE_BASE;
  const k = s ? s.knowledge : 0;
  return 1 + Math.sqrt(k) * base;
}

const KNOWLEDGE_MULT = (k) => 1 + Math.sqrt(k) * KNOWLEDGE_BASE;

// --- SAVE / LOAD --------------------------------------------
function save() {
  try {
    state.lastSave = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    saveFlash = true;
    clearTimeout(saveFlashTimeout);
    saveFlashTimeout = setTimeout(() => { saveFlash = false; renderHeader(); }, 500);
  } catch (e) {
    console.warn('save failed', e);
  }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.version || parsed.version < SAVE_VERSION) {
      const oldVer = parsed.version || 1;
      console.log('migrating save from v' + oldVer + ' to v' + SAVE_VERSION);
      // For v1→v3 jumps, reset run state but preserve Knowledge and Jumps (legacy behavior).
      // For v3→v4 (Wave 4b), do an IN-PLACE migration: keep the player's current run intact
      // and just graft on the new fields so they don't lose progress mid-run.
      if (oldVer === 3) {
        const now = Date.now();
        parsed.version = SAVE_VERSION;
        if (typeof parsed.runStartTime !== 'number') parsed.runStartTime = now;
        if (typeof parsed.patchPoints !== 'number') parsed.patchPoints = 0;
        if (!parsed.patchOwned || typeof parsed.patchOwned !== 'object') parsed.patchOwned = {};
        if (!Array.isArray(parsed.challenges) || parsed.challenges.length === 0) parsed.challenges = rollChallenges();
        if (!parsed.challengeProgress || typeof parsed.challengeProgress !== 'object') parsed.challengeProgress = {};
        if (typeof parsed.cascadeAccum !== 'number') parsed.cascadeAccum = 0;
        if (meta && (parsed.jumps || 0) > meta.totalJumps) {
          meta.totalJumps = parsed.jumps;
          saveMeta();
        }
        return parsed;
      }
      // Wave 4c (v4→v5): pure in-place migration. State shape unchanged; only formulas
      // (knowledge curve, building costs, Aether bonus, Singularity Protocol, additive stacking)
      // differ. Player's mid-run state stays valid; production numbers will recompute next tick.
      if (oldVer === 4) {
        parsed.version = SAVE_VERSION;
        return parsed;
      }
      // Pre-v3 saves: reset run, preserve Knowledge and Jumps as before
      const fresh = freshRun(parsed.knowledge || 0, parsed.jumps || 0);
      if (meta && (parsed.jumps || 0) > meta.totalJumps) {
        meta.totalJumps = parsed.jumps;
        saveMeta();
      }
      return fresh;
    }
    return parsed;
  } catch (e) {
    console.warn('load failed', e);
    return null;
  }
}

function applyOfflineProgress(s) {
  const now = Date.now();
  const cap = (typeof meta !== 'undefined' && meta) ? metaOfflineCap() : MAX_OFFLINE_SECONDS;
  const elapsed = Math.min((now - s.lastSave) / 1000, cap);
  if (elapsed < 5) return null;
  const trait = getTrait(s.sector.traitId);
  const kMult = knowledgeMult(s);
  // Wave 4c: additive stacking — swap state temporarily so PATCH_HAS works against `s`
  const prevState = state;
  state = s;
  const gains = { energy: 0, data: 0, alloy: 0, plasma: 0, aether: 0 };
  BUILDINGS.forEach(b => {
    const count = s.buildings[b.id];
    if (count > 0) {
      const traitMod = trait.mods[b.produces] || 1;
      const addMult = additiveProductionMult(b.produces);  // combined meta+patch bonuses
      const plasmaDouble = patchPlasmaDoubler(b.produces);
      const rate = b.rate * count * s.mult[b.id] * kMult * traitMod * addMult * plasmaDouble;
      gains[b.produces] += rate * elapsed;
    }
  });
  state = prevState;
  let any = false;
  for (const r of RESOURCE_LIST) {
    if (gains[r] > 0) { s.resources[r] += gains[r]; any = true; }
  }
  return any ? { elapsed, gains } : null;
}

function doPulseLogic(visual) {
  if (visual) {
    const reactor = document.querySelector('.reactor');
    if (reactor) {
      reactor.classList.add('pulse');
      setTimeout(() => reactor.classList.remove('pulse'), 150);
    }
  }
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  const traitMod = trait.mods.energy || 1;
  // Wave 4c: additive production stacking applies to pulse base too
  const addMult = additiveProductionMult('energy');
  const clickMetaMult = metaClickMult();  // r3_force ×2 — stays multiplicative (click-specific)
  // Distributed Mind (CMP5): pulse × Mainframes
  const dmMult = state._distributedMind ? Math.max(1, state.buildings.mainframe) : 1;
  // Pulse Synergy (r3_synergy): stacks with CMP5
  const synMult = metaHas('r3_synergy') ? Math.max(1, state.buildings.mainframe) : 1;
  // Critical Pulse (r3_crit): 5% chance ×10
  let critMult = 1;
  if (metaHas('r3_crit') && Math.random() < 0.05) {
    critMult = 10;
    if (visual) flash('◈ CRITICAL PULSE ×10');
  }
  // Click-specific patch effects (pc1 Pulse Focus, pa3 Primed Capacitor) remain multiplicative;
  // they're "this run is a clicker run" identity rather than stacking buffs.
  const baseClick = state.clickPower * kMult * traitMod * addMult * clickMetaMult * dmMult * synMult * critMult
                  * patchClickMult() * patchPulseEarlyBonus();
  state.resources.energy += baseClick;
  // Wave 4b: track pulses for per-run challenges
  if (state.challenges && state.challenges.length) {
    for (const cid of state.challenges) {
      if (!state.challengeProgress[cid]) state.challengeProgress[cid] = { progress: 0, done: false, pulses: 0 };
      state.challengeProgress[cid].pulses = (state.challengeProgress[cid].pulses || 0) + 1;
    }
  }
  // Pulse Cascade (Wave 4b): moved from click-triggered (1s/click) to passive
  // trickle (0.1s every 30s) — see tick() for the new behavior.
  // Singularity Protocol (CMP6, Wave 4c rewrite): was 0.1% of current Data → exploit (any
  // big Data stash made each pulse worth millions). Now: flat +5 Plasma per Mainframe owned.
  // No exponential scaling. Useful boost for CMP-branch builders, capped by building count.
  if (state._singularityProtocol) {
    state.resources.plasma += 5 * (state.buildings.mainframe || 0);
  }
  renderResources();
  renderReactor();
}

function buyBuilding(id) {
  const b = BUILDINGS.find(x => x.id === id);
  const owned = state.buildings[b.id];
  if (!canAffordBuilding(b, owned, state.resources)) return;
  const cost = buildingCost(b, owned);
  for (const [res, amt] of Object.entries(cost)) state.resources[res] -= amt;
  state.buildings[b.id] += 1;
  if (state.buildings[b.id] === 1) {
    const flavor = FIRST_BUILD_FLAVOR[b.id] || `> deployed: ${b.name.toUpperCase()}`;
    pushLog(flavor);
  } else if (state.buildings[b.id] % 25 === 0) {
    pushLog(`> ${b.name} ×${state.buildings[b.id]} // production scaling`);
  }
  save();
  renderAll();
}

function buyUpgrade(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (state.upgrades[u.id]) return;
  if (u.req.some(r => !state.upgrades[r])) return;
  for (const [res, amt] of Object.entries(u.cost)) {
    if (state.resources[res] < amt) return;
  }
  // capture unlocked-state before applying so we know what's new
  const before = { ...state.unlocked };
  for (const [res, amt] of Object.entries(u.cost)) state.resources[res] -= amt;
  state.upgrades[u.id] = true;
  u.apply(state);
  pushLog(`> research complete: ${u.name.toUpperCase()}`);
  // detect new resource unlocks and push flavor
  for (const r of ['data', 'alloy', 'plasma', 'aether']) {
    if (state.unlocked[r] && !before[r] && RESOURCE_UNLOCK_FLAVOR[r]) {
      pushLog(RESOURCE_UNLOCK_FLAVOR[r]);
    }
  }
  if (state.unlocked.prestige && !before.prestige) {
    pushLog('> stellar cartography online // JUMP CAPABILITY ACQUIRED');
  }
  flash(`◆ ${u.name} acquired`);
  save();
  renderAll();
}

function computeKnowledgeGain() {
  const trait = getTrait(state.sector.traitId);
  let jumpMult = trait.jumpMult || 1;
  // Wave 4b: Dead Zone Hunter (pc3) raises Dead Zone's jump bonus from ×1.5 to ×2
  if (state.sector.traitId === 'dead') {
    jumpMult = patchDeadZoneBonus();
  }
  const totalScore = state.resources.plasma + state.resources.alloy / 10 + state.resources.data / 100;
  const base = Math.floor(Math.sqrt(totalScore / 100) * jumpMult);
  // Wave 4c: Aether Knowledge bonus REMOVED (was +10/Aether, gave 432K K in 2min).
  // Aether is now purely an endgame resource — its Knowledge contribution comes
  // ONLY from the optional 'r4_aetheric' protocol (when implemented in Wave 4e),
  // which grants Math.floor(sqrt(aether)) Knowledge per jump. A player with
  // 100 Aether gets +10 K; with 10K Aether gets +100 K. Tiny relative to base scaling.
  const aetherBonus = metaHas('r4_aetheric')
    ? Math.floor(Math.sqrt(Math.max(0, state.resources.aether)))
    : 0;
  // Wave 4b: Star Mapper (pb4) +25% Knowledge gained
  const patchBonus = patchJumpKnowledgeBonus();
  return Math.floor((base + aetherBonus) * patchBonus);
}

function jumpKnowledgeCostMult() {
  // Wave 4b: Glass Cannon (pc4) — Jump knowledge cost +50% (used by UI / future cost gate)
  return patchGlassCannonJumpPenalty();
}

function doJump() {
  const gain = computeKnowledgeGain();
  if (gain < 1) return;
  const newK = state.knowledge + gain;
  const newJumps = state.jumps + 1;
  // Update meta tracking
  meta.totalJumps = (meta.totalJumps || 0) + 1;
  if (newK > meta.lifetimeKnowledgeMax) meta.lifetimeKnowledgeMax = newK;
  state = freshRun(newK, newJumps);
  // Record this sector's trait as visited
  meta.traitsVisited[state.sector.traitId] = true;
  saveMeta();
  flash(`✦ JUMPED // +${gain} KNOWLEDGE`);
  // Run milestone check after jump (totalJumps may unlock some)
  const newMs = checkMilestones();
  for (const m of newMs) pushLog(`> milestone: ${m.name} // +${m.pp} PP`);
  save();
  currentTab = 'build';
  renderAll();
}

function hardReset() {
  const wipeMeta = confirm(
    'Wipe current run progress?\n\n' +
    '• OK = wipe current run (Knowledge, resources, buildings). Keeps Protocols, milestones, and PP.\n' +
    '• Cancel = back out.\n\n' +
    'After this, you\'ll get a second prompt asking whether to wipe ALL meta-progression too.'
  );
  if (!wipeMeta) return;
  const wipeAll = confirm(
    'ALSO wipe permanent progression?\n\n' +
    '• OK = NUKE EVERYTHING. All Protocols, milestones, and PP gone forever.\n' +
    '• Cancel = wipe current run only, keep meta-progression intact.'
  );
  localStorage.removeItem(SAVE_KEY);
  if (wipeAll) {
    localStorage.removeItem(META_KEY);
    meta = freshMeta();
  }
  state = freshRun(0, 0);
  save();
  saveMeta();
  renderAll();
}

function getProduction() {
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  const out = { energy: 0, data: 0, alloy: 0, plasma: 0, aether: 0 };
  BUILDINGS.forEach(b => {
    const traitMod = trait.mods[b.produces] || 1;
    const addMult = additiveProductionMult(b.produces);   // Wave 4c
    const plasmaDouble = patchPlasmaDoubler(b.produces);
    out[b.produces] += b.rate * state.buildings[b.id] * state.mult[b.id] * kMult * traitMod * addMult * plasmaDouble;
  });
  return { production: out, kMult, trait };
}

function coreTreeHTML() {
  const SIZE = 560;
  const CENTER = SIZE / 2;
  // Draw lines between adjacent rings (each node connects to all prev-ring nodes that are owned)
  let lines = '';
  for (const node of CORE_TREE) {
    if (node.ring === 1) continue;
    const g = TREE_GEOMETRY[node.id];
    if (!g) continue;
    const prevRing = CORE_TREE.filter(n => n.ring === node.ring - 1);
    for (const prev of prevRing) {
      const pg = TREE_GEOMETRY[prev.id];
      if (!pg) continue;
      const active = meta.coreOwned[prev.id] && (meta.coreOwned[node.id] || isNodeUnlockable(node, meta));
      const stroke = meta.coreOwned[prev.id] && meta.coreOwned[node.id] ? 'var(--cyan)' :
                     active ? 'var(--cyan-dim)' : 'rgba(94,226,255,0.06)';
      lines += `<line x1="${CENTER + pg.x}" y1="${CENTER + pg.y}" x2="${CENTER + g.x}" y2="${CENTER + g.y}" stroke="${stroke}" stroke-width="1" />`;
    }
  }
  // Draw orbital rings (visual guides)
  let orbits = '';
  for (let r = 1; r <= 3; r++) {
    const rad = { 1: 75, 2: 145, 3: 215 }[r];
    orbits += `<circle cx="${CENTER}" cy="${CENTER}" r="${rad}" fill="none" stroke="rgba(94,226,255,0.08)" stroke-width="1" stroke-dasharray="2,4" />`;
  }
  // Center sigil
  const centerSigil = `
    <circle cx="${CENTER}" cy="${CENTER}" r="22" fill="rgba(94,226,255,0.08)" stroke="var(--cyan)" stroke-width="1"/>
    <text x="${CENTER}" y="${CENTER + 8}" text-anchor="middle" font-size="22" fill="var(--cyan)" style="text-shadow: 0 0 8px var(--cyan);">◈</text>
  `;
  // Nodes
  let nodes = '';
  for (const node of CORE_TREE) {
    const g = TREE_GEOMETRY[node.id];
    if (!g) continue;
    const owned = meta.coreOwned[node.id];
    const unlockable = isNodeUnlockable(node, meta);
    const canAfford = meta.pp >= node.cost;
    let cls = 'tree-node';
    if (owned) cls += ' owned';
    else if (unlockable && canAfford) cls += ' afford';
    else if (unlockable) cls += ' available';
    else cls += ' locked';
    nodes += `
      <g class="${cls}" onclick="${owned || !unlockable ? '' : `buyCoreNode('${node.id}')`}" style="cursor: ${owned || !unlockable ? 'default' : 'pointer'}">
        <circle cx="${CENTER + g.x}" cy="${CENTER + g.y}" r="16" />
        <text x="${CENTER + g.x}" y="${CENTER + g.y + 4}" text-anchor="middle" font-size="11">${node.cost}</text>
        <title>${node.name}: ${node.desc} (${node.cost} PP)</title>
      </g>
    `;
  }
  // Legend / info area
  const ringLabels = { 1: 'ORIGIN', 2: 'ACQUISITION', 3: 'REFLEX' };
  return `
    <div class="tree-wrap">
      <div class="tree-svg-wrap">
        <svg viewBox="0 0 ${SIZE} ${SIZE}" width="100%" style="max-width:560px;display:block;margin:0 auto;">
          ${orbits}
          ${lines}
          ${centerSigil}
          ${nodes}
        </svg>
      </div>
      <div class="tree-info">
        <div class="tree-info-title">// CORE PROTOCOLS</div>
        <p class="tree-info-text">
          Written to your core. Survives every Jump. Hover or tap any node to see what it does.
        </p>
        <div class="ring-legend">
          ${[1,2,3].map(r => {
            const ringNodes = CORE_TREE.filter(n => n.ring === r);
            const ownedCount = ringNodes.filter(n => meta.coreOwned[n.id]).length;
            const unlocked = r === 1 || ringNodes.some(n => isNodeUnlockable(n, meta));
            return `<div class="ring-row ${unlocked ? '' : 'locked'}">
              <span class="ring-name">R${r} · ${ringLabels[r] || '???'}</span>
              <span class="ring-progress">${ownedCount}/${ringNodes.length}</span>
            </div>`;
          }).join('')}
          <div class="ring-row locked"><span class="ring-name">R4-R6</span><span class="ring-progress">— v2.x</span></div>
        </div>
        <div class="tree-node-detail" id="tree-node-detail">
          <em>Tap a node to view details.</em>
        </div>
      </div>
    </div>
  `;
}

function patchGridHTML() {
  const pp = state.patchPoints || 0;
  const rows = ['A', 'B', 'C'];
  const rowTitles = { A: 'BURST', B: 'COMPOUND', C: 'SPECIALTY' };
  const rowDesc = {
    A: 'Front-loaded effects. Help the opening of a run.',
    B: 'Compounding effects. Reward longer runs.',
    C: 'Build-defining tradeoffs. Pick one to specialize.',
  };
  // Challenge progress block
  const challenges = (state.challenges || []).map(cid => {
    const tpl = CHALLENGE_TEMPLATES.find(c => c.id === cid);
    if (!tpl) return '';
    const prog = state.challengeProgress[cid] || { progress: 0, done: false };
    const pct = Math.min(100, (prog.progress / tpl.target) * 100);
    return `
      <div class="obj ${prog.done?'done':''}">
        <div class="obj-marker">${prog.done ? '◆' : '◇'}</div>
        <div class="obj-text">
          <div class="obj-name">${tpl.name}</div>
          <div class="obj-desc">${tpl.desc}</div>
          <div style="margin-top:4px;height:3px;background:rgba(94,226,255,0.08);position:relative;">
            <div style="width:${pct}%;height:100%;background:var(--amber);transition:width 0.3s;"></div>
          </div>
        </div>
        <div class="obj-pp" style="color:var(--amber);">+${tpl.pp} PaP</div>
      </div>
    `;
  }).join('');

  const grid = rows.map(r => {
    const nodes = PATCH_GRID.filter(n => n.row === r);
    const cards = nodes.map(n => {
      const owned = !!state.patchOwned[n.id];
      const afford = !owned && pp >= n.cost;
      const cls = owned ? 'owned' : (afford ? 'afford' : 'locked');
      return `
        <button class="node ${cls}" ${owned || !afford ? 'disabled' : ''} onclick="buyPatchNode('${n.id}')">
          <div class="node-tier">${n.cost} PaP</div>
          <div class="node-name">${n.name}</div>
          <div class="node-effect">${n.desc}</div>
          ${owned ? '<div class="node-status">◆ LOADED</div>' : ''}
        </button>
      `;
    }).join('');
    return `
      <div class="branch">
        <div class="branch-title" style="color:var(--amber);">// ROW ${r} — ${rowTitles[r]}</div>
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;">${rowDesc[r]}</div>
        <div class="branch-nodes">${cards}</div>
      </div>
    `;
  }).join('');

  return `
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div class="obj-summary">
        <div><span>UNSPENT PATCH POINTS</span><strong style="color:var(--amber);">${pp}</strong></div>
        <div><span>LOADED PATCHES</span><strong>${Object.keys(state.patchOwned||{}).length} / 12</strong></div>
      </div>
      <div>
        <div class="obj-cat-title" style="margin-bottom:10px;">// THIS RUN'S CHALLENGES</div>
        <div class="obj-list">${challenges || '<div class="empty">// no challenges this run</div>'}</div>
      </div>
      <div class="branches">${grid}</div>
      <p style="color:var(--text-dim);font-size:11px;line-height:1.6;margin:0;">
        Patches are loaded as runtime modifications. <strong>All patches and Patch Points are purged on Jump.</strong>
        Complete challenges to earn more Patch Points (PaP) during this run.
      </p>
    </div>
  `;
}

function buildTabHTML() {
  const { kMult, trait } = getProduction();

  if (visible.length === 0) return '<div class="empty">// no constructs available</div>';
  return `<div class="grid-list">` + visible.map(b => {
    const owned = state.buildings[b.id];

      `<span class="cost-token" data-res="${res}" style="color:${state.resources[res] >= amt ? 'var(--text)' : 'var(--danger)'}">${fmt(amt)} ${RESOURCE_META[res].sym}</span>`
    ).join('  ');
    return `
      <button class="card ${afford?'afford':''}" data-id="${b.id}" ${afford?'':'disabled'}

        style="--c: ${RESOURCE_META[b.produces].color}">
        <div class="card-row">
          <div class="card-name">${b.name}</div>

            const owned = state.upgrades[u.id];

            if (!reqsMet && !owned) {
              return `<div class="node locked">

            }
            return `
              <button class="node ${owned?'owned':''} ${afford && !owned?'afford':''}"
                data-id="${u.id}"
                ${owned || !afford ? 'disabled' : ''}
                onclick="buyUpgrade('${u.id}')">
                <div class="node-tier">T${u.tier}</div>
                <div class="node-name">${u.name}</div>
                <div class="node-effect">${u.effect}</div>

                  <div class="node-cost">

                      `<span>${fmt(amt)} ${RESOURCE_META[res].sym}</span>`).join('')}
                  </div>
                ` : `<div class="node-status">◆ INSTALLED</div>`}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('') + `</div>`;
}

function jumpTabHTML() {
  const kGain = computeKnowledgeGain();
  const trait = getTrait(state.sector.traitId);
  const jumpMultNote = trait.jumpMult ? ` <em style="color:var(--amber)">(${trait.name}: ×${trait.jumpMult})</em>` : '';
  // Wave 4c: aetherBonus now requires r4_aetheric protocol and uses sqrt
  const aetherBonus = metaHas('r4_aetheric')
    ? Math.floor(Math.sqrt(Math.max(0, state.resources.aether)))
    : 0;
  const projected = { knowledge: state.knowledge + kGain, _causalEng: state._causalEng };
  return `
    <div class="jump-pane">
      <div class="jump-title">// STELLAR JUMP</div>
      <p class="jump-text">
        Collapse current system. Reset all resources, buildings, and research.
        Retain <strong>KNOWLEDGE</strong> as a permanent multiplier on all future production.
        New sector and trait will be rolled on arrival.
      </p>
      <div class="jump-stats">
        <div><span>CURRENT KNOWLEDGE</span><strong>${state.knowledge}</strong></div>
        <div><span>GAIN ON JUMP${jumpMultNote}</span><strong class="gain">+${kGain}</strong></div>
        <div><span>NEW MULTIPLIER</span><strong>×${knowledgeMult(projected).toFixed(2)}</strong></div>
      </div>
      ${aetherBonus > 0 ? `<div class="jump-hint" style="color:var(--gold);margin-bottom:12px">// AETHERIC RESONANCE protocol: +${aetherBonus} Knowledge from Aether (√)</div>` : ''}
      <button class="jump-btn" ${kGain < 1 ? 'disabled' : ''} onclick="doJump()">
        ${kGain < 1 ? '✦ INSUFFICIENT MASS' : `✦ INITIATE JUMP (+${kGain})`}
      </button>
      <div class="jump-hint">
        ${kGain < 1
          ? '// accumulate more plasma & alloy to enable jump'
          : '// jumps are irreversible. proceed with intention.'}
      </div>
    </div>
  `;
}

function renderAll() {
  document.getElementById('app').innerHTML = `
    <header class="hdr" id="header"></header>
    <section class="res-bar" id="resources"></section>
    <main class="main">
      <div class="reactor-col">
        <div class="panel reactor-panel">
          <div class="panel-title">// MANUAL PULSE</div>
          <button class="reactor" onclick="pulse()" aria-label="Pulse reactor">
            <div class="reactor-ring"></div>
            <div class="reactor-ring r2"></div>
            <div class="reactor-core">
              <div class="reactor-sym">◈</div>
              <div class="reactor-amt" id="reactor-amt"></div>
            </div>
          </button>
          <div class="reactor-hint">CLICK TO INJECT ENERGY</div>
        </div>
        <div class="panel">
          <div class="panel-title">// SYSTEM LOG</div>
          <div class="log" id="log"></div>
        </div>
      </div>
      <div class="right-col">
        <div class="tabs" id="tabs"></div>
        <div class="panel tab-panel" id="tab-panel"></div>
      </div>
    </main>
  `;
  renderHeader();
  renderResources();
  renderReactor();
  renderLog();
  renderTabs();
  renderTabPanel();
}

// --- TICK ---------------------------------------------------
let lastTick = Date.now();
let lastSaveTime = Date.now();

function tick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  const kMult = knowledgeMult(state);
  const trait = getTrait(state.sector.traitId);
  BUILDINGS.forEach(b => {
    const count = state.buildings[b.id];
    if (count > 0) {
      const traitMod = trait.mods[b.produces] || 1;
      const addMult = additiveProductionMult(b.produces);  // Wave 4c: combined meta+patch
      const plasmaDouble = patchPlasmaDoubler(b.produces);
      const gain = b.rate * count * state.mult[b.id] * kMult * traitMod * addMult * plasmaDouble * dt;
      state.resources[b.produces] += gain;
    }
  });
  // Pulse Cascade (Wave 4b nerfed): passive trickle — 0.1s of total production every 30s
  if (metaHas('r3_cascade')) {
    state.cascadeAccum = (state.cascadeAccum || 0) + dt;
    while (state.cascadeAccum >= 30) {
      state.cascadeAccum -= 30;
      BUILDINGS.forEach(b => {
        const count = state.buildings[b.id];
        if (count > 0) {
          const tmod = trait.mods[b.produces] || 1;
          const addMult = additiveProductionMult(b.produces);
          const plasmaDouble = patchPlasmaDoubler(b.produces);
          state.resources[b.produces] += b.rate * count * state.mult[b.id] * kMult * tmod * addMult * plasmaDouble * 0.1;
        }
      });
    }
  }
  // Trigger Memory: auto-pulse 1/s when window is blurred
  if (windowBlurred && metaHas('r3_trigger')) {
    autoPulseAccum += dt;
    while (autoPulseAccum >= 1) {
      autoPulseAccum -= 1;
      doPulseLogic(false);
    }
  }
  // Check milestones (cheap — early exit on each one)
  const newMs = checkMilestones();
  if (newMs.length) {
    for (const m of newMs) {
      pushLog(`> milestone: ${m.name} // +${m.pp} PP`);
    }
    if (newMs.length === 1) flash(`◆ MILESTONE // ${newMs[0].name}`);
    else flash(`◆ ${newMs.length} MILESTONES achieved`);
  }
  // Wave 4b: check per-run challenges
  const newCh = checkChallenges();
  if (newCh.length) {
    for (const c of newCh) pushLog(`> challenge complete: ${c.name} // +${c.pp} Patch Points`);
    flash(`◇ CHALLENGE // ${newCh[0].name}`);
  }
  renderResources();
  refreshAffordability();
  maybeAmbientLog(now);
  // periodic save every 5s
  if (now - lastSaveTime > 5000) {
    save();
    saveMeta();
    lastSaveTime = now;
    renderHeader();
  }
}

let windowBlurred = false;
let autoPulseAccum = 0;
window.addEventListener('blur', () => { windowBlurred = true; });
window.addEventListener('focus', () => { windowBlurred = false; });

// Lightweight: update only afford-state classes & disabled attribute on cards/nodes.
// Does NOT re-render the whole panel — preserves scroll, prevents flicker.
function refreshAffordability() {
  // Building cards
  document.querySelectorAll('.card[data-id]').forEach(el => {
    const id = el.getAttribute('data-id');
    const b = BUILDINGS.find(x => x.id === id);
    if (!b) return;
    const owned = state.buildings[b.id];
    const afford = canAffordBuilding(b, owned, state.resources);
    el.classList.toggle('afford', afford);
    if (afford) el.removeAttribute('disabled'); else el.setAttribute('disabled', '');
    // Update each cost token color
    const cost = buildingCost(b, owned);
    const tokens = el.querySelectorAll('.cost-token[data-res]');
    tokens.forEach(t => {
      const res = t.getAttribute('data-res');
      const amt = cost[res] || 0;
      t.style.color = state.resources[res] >= amt ? 'var(--text)' : 'var(--danger)';
    });
  });
  // Research nodes
  document.querySelectorAll('.node[data-id]').forEach(el => {
    const id = el.getAttribute('data-id');
    const u = UPGRADES.find(x => x.id === id);
    if (!u) return;
    if (state.upgrades[u.id]) return; // owned, nothing to update
    const reqsMet = u.req.every(r => state.upgrades[r]);
    if (!reqsMet) return;
    const afford = Object.entries(u.cost).every(([res, amt]) => state.resources[res] >= amt);
    el.classList.toggle('afford', afford);
    if (afford) el.removeAttribute('disabled'); else el.setAttribute('disabled', '');
  });
  // Jump button affordability handled by full tab re-render rarely; do it cheaply here too
  const jumpBtn = document.querySelector('.jump-btn');
  if (jumpBtn) {
    const kGain = computeKnowledgeGain();
    if (kGain >= 1) {
      jumpBtn.removeAttribute('disabled');
      jumpBtn.textContent = `✦ INITIATE JUMP (+${kGain})`;
    } else {
      jumpBtn.setAttribute('disabled', '');
      jumpBtn.textContent = '✦ INSUFFICIENT MASS';
    }
  }
}

// --- INIT ---------------------------------------------------
window.addEventListener('beforeunload', () => save());
window.addEventListener('blur', () => save());

function init() {
  meta = loadMeta();
  state = load();
  if (!state) {
    state = freshRun(0, 0);
  } else {
    const offline = applyOfflineProgress(state);
    if (offline) {
      // schedule modal after render
      setTimeout(() => {
        const lines = RESOURCE_LIST
          .filter(r => offline.gains[r] > 0)
          .map(r => `<div class="modal-gains-line">
            <span>${RESOURCE_META[r].sym} ${RESOURCE_META[r].label}</span>
            <span>+${fmt(offline.gains[r])}</span>
          </div>`).join('');
        const mins = Math.floor(offline.elapsed / 60);
        const secs = Math.floor(offline.elapsed % 60);
        const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        const cap = metaOfflineCap() / 3600;
        showModal(
          '◈ WELCOME BACK',
          `<p>System was idle for <strong>${timeStr}</strong>. Auto-collectors continued operations:</p>
           <div class="modal-gains">${lines}</div>
           <p style="color:var(--text-dim);font-size:11px;">Offline collection capped at ${cap}h.</p>`,
          'RESUME OPERATIONS'
        );
      }, 100);
    }
  }
  // Record current sector trait as visited (for the sector milestones)
  if (state && state.sector) {
    if (!meta.traitsVisited[state.sector.traitId]) {
      meta.traitsVisited[state.sector.traitId] = true;
      saveMeta();
    }
  }
  // Run milestone check on load (handles save-format upgrades adding new milestones)
  checkMilestones();
  renderAll();
  setInterval(tick, 100);
}

init();
</script>
